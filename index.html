<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aquarium Adventure</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  touch-action: none;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #000;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
#ui-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 10;
}
#hud {
  position: fixed;
  top: 12px; right: 12px;
  background: rgba(0,0,0,0.65);
  padding: 8px 14px;
  border-radius: 12px;
  z-index: 20;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 100px;
}
#money-display {
  color: #FFD700;
  font-size: 20px;
  font-weight: bold;
}
#hud-inventory {
  color: #4FC3F7;
  font-size: 14px;
  display: flex;
  gap: 10px;
}
#hud-inventory span {
  white-space: nowrap;
}
#inventory-btn {
  position: fixed;
  bottom: 20px; right: 20px;
  width: 60px; height: 60px;
  background: rgba(139,69,19,0.9);
  border: 3px solid #D2691E;
  border-radius: 15px;
  z-index: 20;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}
#inventory-btn .count {
  position: absolute;
  top: -5px; right: -5px;
  background: #e74c3c;
  color: white;
  border-radius: 50%;
  width: 22px; height: 22px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
#inventory-panel {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20,20,40,0.95);
  border: 3px solid #4FC3F7;
  border-radius: 15px;
  padding: 20px;
  z-index: 30;
  display: none;
  min-width: 300px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  color: white;
}
#inventory-panel h2 {
  text-align: center;
  margin-bottom: 15px;
  color: #4FC3F7;
}
#inventory-panel .inv-section {
  margin-bottom: 15px;
}
#inventory-panel .inv-section h3 {
  color: #FFD700;
  margin-bottom: 8px;
  font-size: 16px;
}
#inventory-panel .inv-item {
  padding: 5px 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  margin-bottom: 4px;
  font-size: 15px;
}
#inventory-panel .close-btn {
  position: absolute;
  top: 10px; right: 15px;
  font-size: 24px;
  cursor: pointer;
  color: #aaa;
}
#catch-menu {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(10,10,30,0.95);
  border: 3px solid #4FC3F7;
  border-radius: 15px;
  padding: 20px;
  z-index: 30;

  color: white;
}
#catch-menu h3 {
  margin-bottom: 5px;
  font-size: 20px;
}
#catch-menu .fish-preview {
  font-size: 50px;
  margin: 10px 0;
}
#catch-menu .menu-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 15px;
}
#catch-menu .menu-btn {
  padding: 12px 24px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}
#catch-menu .btn-catch { background: #27ae60; }
#catch-menu .btn-cancel { background: #7f8c8d; margin-top: 10px; padding: 8px 20px; font-size: 14px; }

#catch-minigame {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,20,0.85);
  z-index: 35;
  display: none;
  justify-content: center;
  align-items: center;
}
#catch-minigame canvas {
  border-radius: 15px;
  border: 3px solid #4FC3F7;
}
#catch-result {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(10,10,30,0.95);
  border: 3px solid #FFD700;
  border-radius: 15px;
  padding: 30px;
  z-index: 40;
  display: none;
  text-align: center;
  color: white;
  font-size: 22px;
}
#scuba-timer {
  position: fixed;
  top: 15px; left: 15px;
  background: rgba(0,0,0,0.6);
  color: #4FC3F7;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  z-index: 20;

}
#zone-label {
  position: fixed;
  top: 60px; left: 15px;
  background: rgba(0,0,0,0.6);

  border-radius: 10px;
  font-size: 16px;
  z-index: 20;

}
#mermaid-prompt {
  position: fixed;
  bottom: 160px; left: 50%;
  transform: translateX(-50%);
  background: rgba(156,39,176,0.9);

  padding: 12px 25px;
  border-radius: 12px;
  font-size: 18px;

  z-index: 20;
  display: none;

  animation: mermaidPulse 2s ease-in-out infinite;
}
@keyframes mermaidPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(156,39,176,0.4); }
  50% { box-shadow: 0 0 20px rgba(156,39,176,0.8); }
}
#shop-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 50;
  display: none;
  overflow-y: auto;
}
#shop-panel {
  max-width: 420px;
  margin: 20px auto;
  padding: 20px;
}
#shop-panel .shop-header {
  text-align: center;
  margin-bottom: 20px;
}
#shop-panel .shop-header h2 {
  color: #CE93D8;
  font-size: 24px;
  margin-bottom: 4px;
}
#shop-panel .shop-header p {

  font-size: 14px;
}
#shop-panel .shop-money {
  text-align: center;
  color: #FFD700;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 16px;
}
.shop-item {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);

}
.shop-item:hover, .shop-item:active {

}
.shop-item.owned {

}
.shop-item .item-icon {
  font-size: 32px;
  width: 50px;
  text-align: center;
  flex-shrink: 0;
}
.shop-item .item-info {
  flex: 1;
  margin-left: 10px;
}
.shop-item .item-name {
  color: white;
  font-weight: bold;
  font-size: 16px;
}
.shop-item .item-desc {
  color: #aaa;
  font-size: 12px;
  margin-top: 2px;
}
.shop-item .item-price {
  color: #FFD700;
  font-weight: bold;
  font-size: 16px;
  flex-shrink: 0;
  margin-left: 10px;
}
.shop-item .item-price.bought {

}
#shop-close {
  display: block;
  margin: 20px auto;
  padding: 12px 40px;
  background: rgba(255,255,255,0.1);
  border: 2px solid #CE93D8;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
#enter-aquarium-prompt {
  position: fixed;
  bottom: 100px; left: 50%;
  transform: translateX(-50%);
  background: rgba(13,71,161,0.9);
  color: white;
  padding: 12px 25px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  z-index: 20;
  display: none;
  cursor: pointer;
  border: 2px solid #4FC3F7;
}
#dive-prompt {
  position: fixed;
  bottom: 160px; left: 50%;
  transform: translateX(-50%);
  background: rgba(21,101,192,0.9);
  color: white;
  padding: 12px 25px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  z-index: 20;
  display: none;
  cursor: pointer;
  border: 2px solid #29B6F6;
}
#surface-btn {
  position: fixed;
  bottom: 100px; left: 50%;
  transform: translateX(-50%);
  background: rgba(200,100,0,0.8);
  color: white;
  padding: 12px 25px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  z-index: 20;
  display: none;
  cursor: pointer;
  border: 2px solid #FFB74D;
}
#exit-aquarium-btn {
  position: fixed;
  bottom: 30px; left: 50%;
  transform: translateX(-50%);
  background: rgba(120,80,40,0.85);
  color: white;
  padding: 10px 22px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  z-index: 20;
  display: none;
  cursor: pointer;
  border: 2px solid #D4A843;
}
</style>

<body>

<div id="hud">
  <div id="money-display">$100</div>
  <div id="hud-inventory">
    <span>🐟 <span id="hud-fish">0</span>/<span id="hud-fish-max">10</span></span>
    <span>🏛️ <span id="hud-tanked">0</span></span>
  </div>
</div>
<div id="scuba-timer">🫧 Air: 60s</div>
<div id="zone-label">🐠 Coral Reef</div>
<div id="enter-aquarium-prompt" onclick="enterAquarium()">🏛️ Enter Aquarium</div>
<div id="surface-btn" onclick="surface()">⬆️ Surface</div>
<div id="exit-aquarium-btn" onclick="exitAquarium()">🚪 Leave Aquarium</div>
<div id="dive-prompt" onclick="enterOcean()">🤿 Dive In!</div>
<div id="mermaid-prompt" onclick="openMermaidShop()">🧜‍♀️ Talk to Mermaid</div>

<div id="shop-overlay">
  <div id="shop-panel">
    <div class="shop-header">
      <h2>🧜‍♀️ Mermaid Grotto Shop</h2>
      <p>Welcome to our cave! Take a breath and browse.</p>
    </div>
    <div class="shop-money" id="shop-money-display">$100</div>
    <div id="shop-items-list"></div>

  </div>
</div>

<div id="inventory-btn" onclick="toggleInventory()">
  🎒
  <span class="count" id="inv-count">0</span>

<div id="catch-menu">
  <h3 id="catch-target-name">Clownfish</h3>

    <button class="menu-btn btn-catch" onclick="startCatchMinigame()">🥅 Catch</button>
  </div>
  <button class="menu-btn btn-cancel" onclick="closeCatchMenu()">Cancel</button>
</div>

<div id="catch-minigame">
  <canvas id="minigame-canvas" width="350" height="350"></canvas>
</div>

<div id="catch-result"></div>

<canvas id="game"></canvas>

<script>
// ============ GAME STATE ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const STATE = {
  money: 100,
  scene: 'title', // 'title', 'creator', 'beach', 'ocean', or 'aquarium'
  zone: 'coral',
  scubaTime: 60, // seconds
  maxScubaTime: 60,
  scubaTimer: null,
  inventory: { fish: [], decorations: [] },
  maxFish: 10,
  maxDeco: 10,
  aquariumFish: [],
  aquariumDecorations: [],
  tankedFish: [], // permanent fish in tanks (survive between dives)
};

// ============ PLAYER ============
const SKIN_TONES  = ['#FDDBB4','#F0C27F','#C68642','#8D5524','#4A2912'];
const HAIR_COLORS = [
  '#0A0A0A','#2C1A0E','#5C3A1E','#8B5E3C','#C47D3A','#C8A97A','#E8D48A','#B8B8B8','#E8E8E8',
  '#AA0000','#D44DAA','#3A6ECC','#5B2D8E','#1A8C4A',
];
const HAIR_STYLES = ['short','bob','curly','afro','long','wavy','spiky','bun','braids'];
const FACE_STYLES = ['happy','cool','grin','surprised','determined','soft'];
const HAT_STYLES  = ['none','beanie','bucket','cap','crown','bow','sunhat'];
const BODY_TYPES  = ['slim','athletic','curvy','stocky'];

const player = {
  x: 0, y: 0,
  targetX: 0, targetY: 0,
  speed: 3,
  size: 40,
  skinIdx: 0,
  hairStyleIdx: 0,
  hairColorIdx: 0,
  faceIdx: 0,
  hatIdx: 0,
  bodyIdx: 1,
  get color()    { return SKIN_TONES[this.skinIdx]; },
  get hairColor(){ return HAIR_COLORS[this.hairColorIdx]; },
  get hairStyle(){ return HAIR_STYLES[this.hairStyleIdx]; },
  get faceStyle(){ return FACE_STYLES[this.faceIdx]; },
  get hatStyle() { return HAT_STYLES[this.hatIdx]; },
  get bodyType() { return BODY_TYPES[this.bodyIdx]; },
  inWater: false,
};

// Body type proportions: [shoulderW, hipW, legMult]
const BODY_PROPS = {
  slim:     [0.48, 0.44, 1.05],
  athletic: [0.65, 0.52, 1.0],
  curvy:    [0.55, 0.70, 0.95],
  stocky:   [0.72, 0.70, 0.75],
};

// ============ CHARACTER CREATOR ============
let creatorButtons = [];

function drawHair(cx, cy, s, bob, style, color) {
  // Head center=(cx, cy-s*0.52+bob), radius=s*0.27, eyes at cy-s*0.55+bob
  // ALL hair must stay ABOVE the eye line
  const hc = cy - s*0.52 + bob;
  const hr = s * 0.27;
  const topY = hc - hr;
  const earY = hc;
  ctx.fillStyle = color;
  ctx.strokeStyle = color;

  if (style === 'short') {
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.05, hr*0.5, 0, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.fillRect(cx - hr*1.02, topY + hr*0.3, hr*0.15, hr*0.35);
    ctx.fillRect(cx + hr*0.87, topY + hr*0.3, hr*0.15, hr*0.35);
  } else if (style === 'bob') {
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.25, hr*1.1, hr*0.55, 0, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(cx - hr*1.08, earY - hr*0.3, hr*0.25, hr*1.0, 3);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(cx + hr*0.83, earY - hr*0.3, hr*0.25, hr*1.0, 3);
    ctx.fill();
  } else if (style === 'curly') {
    for (let i = 0; i < 9; i++) {
      const a = Math.PI*0.85 + (i/8)*Math.PI*1.3;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a)*hr*0.85, topY + hr*0.2 + Math.sin(a)*hr*0.45, hr*0.32, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (style === 'afro') {
    // Drawn BEHIND the head. Wide volume around and above, head covers the front.
    // Main shape: wide ellipse behind head
    ctx.beginPath();
    ctx.ellipse(cx, hc - hr*0.1, hr*1.5, hr*1.4, 0, 0, Math.PI*2);
    ctx.fill();
    // Texture bumps around the edge
    const tc = color === '#0A0A0A' ? '#1a1a1a' : shadeColor(color, 15);
    ctx.fillStyle = tc;
    for (let i = 0; i < 14; i++) {
      const a = (i/14)*Math.PI*2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a)*hr*1.25, hc - hr*0.1 + Math.sin(a)*hr*1.15, hr*0.22, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (style === 'long') {
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.25, hr*1.08, hr*0.55, 0, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(cx - hr*1.1, earY - hr*0.2, hr*0.28, hr*1.8, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(cx + hr*0.82, earY - hr*0.2, hr*0.28, hr*1.8, 4);
    ctx.fill();
  } else if (style === 'wavy') {
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.25, hr*1.08, hr*0.55, 0, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = hr * 0.3;
    ctx.lineCap = 'round';
    [-1, 1].forEach(function(side) {
      ctx.beginPath();
      ctx.moveTo(cx + side*hr*0.95, earY);
      for (let t = 0; t <= 1; t += 0.12) {
        ctx.lineTo(cx + side*hr*0.95 + Math.sin(t*Math.PI*2.5)*hr*0.15*side, earY + t*hr*1.6);
      }
      ctx.stroke();
    });
    ctx.lineWidth = 1;
  } else if (style === 'spiky') {
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.35, hr*1.05, hr*0.4, 0, Math.PI, Math.PI*2);
    ctx.fill();
    for (let i = 0; i < 6; i++) {
      const tx = cx - hr*0.8 + i*hr*0.32;
      const height = hr*(0.5 + (i===2||i===3 ? 0.4 : 0.15));
      ctx.beginPath();
      ctx.moveTo(tx, topY + hr*0.35);
      ctx.lineTo(tx + hr*0.16, topY + hr*0.35 - height);
      ctx.lineTo(tx + hr*0.32, topY + hr*0.35);
      ctx.fill();
    }
  } else if (style === 'bun') {
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.05, hr*0.45, 0, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, topY - hr*0.15, hr*0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.arc(cx, topY - hr*0.15, hr*0.3, 0, Math.PI*2);
    ctx.fill();
  } else if (style === 'braids') {
    // Top cap of hair
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.05, hr*0.5, 0, Math.PI, Math.PI*2);
    ctx.fill();
    // Two braids starting from BEHIND the head (at ear level, outside the face)
    [-1, 1].forEach(function(side) {
      const bx = cx + side*hr*1.0;
      for (let seg = 0; seg < 4; seg++) {
        ctx.fillStyle = seg % 2 === 0 ? color : shadeColor(color, -20);
        ctx.beginPath();
        ctx.ellipse(bx, earY + seg*hr*0.3, hr*0.12, hr*0.17, 0, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }
}

function shadeColor(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (n>>16) + pct));
  const g = Math.min(255, Math.max(0, ((n>>8)&0xFF) + pct));
  const b = Math.min(255, Math.max(0, (n&0xFF) + pct));
  return `rgb(${r},${g},${b})`;
}

function drawHat(cx, cy, s, bob, style, hairColor) {
  if (style === 'none') return;
  // Same head coordinates as drawHair
  const hc = cy - s*0.52 + bob;
  const hr = s * 0.27;
  const topY = hc - hr;
  ctx.lineCap = 'round';

  if (style === 'beanie') {
    ctx.fillStyle = '#E53935';
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.35, hr*1.1, hr*0.6, 0, Math.PI, Math.PI*2);
    ctx.fill();
    // Ribbed band at bottom of beanie
    ctx.fillStyle = '#C62828';
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.35, hr*1.1, hr*0.12, 0, 0, Math.PI*2);
    ctx.fill();
    // Pompom on top
    ctx.fillStyle = '#FFCDD2';
    ctx.beginPath();
    ctx.arc(cx, topY - hr*0.15, hr*0.25, 0, Math.PI*2);
    ctx.fill();
  } else if (style === 'bucket') {
    // Dome
    ctx.fillStyle = '#8D6E63';
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.05, hr*0.55, 0, Math.PI, Math.PI*2);
    ctx.fill();
    // Wide brim
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.35, hr*1.5, hr*0.18, 0, 0, Math.PI*2);
    ctx.fill();
    // Band
    ctx.fillStyle = '#795548';
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.08, hr*0.08, 0, 0, Math.PI*2);
    ctx.fill();
  } else if (style === 'cap') {
    ctx.fillStyle = '#1565C0';
    // Crown
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.08, hr*0.5, 0, Math.PI, Math.PI*2);
    ctx.fill();
    // Band
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.35, hr*1.1, hr*0.1, 0, 0, Math.PI*2);
    ctx.fill();
    // Brim sticking out front
    ctx.beginPath();
    ctx.ellipse(cx + hr*0.7, topY + hr*0.35, hr*0.65, hr*0.1, -0.15, 0, Math.PI*2);
    ctx.fill();
  } else if (style === 'crown') {
    ctx.fillStyle = '#FFD700';
    const crownBase = topY + hr*0.2;
    ctx.beginPath();
    ctx.roundRect(cx - hr*0.85, crownBase, hr*1.7, hr*0.4, 3);
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const px = cx - hr*0.85 + i * hr*0.42;
      ctx.beginPath();
      ctx.moveTo(px, crownBase);
      ctx.lineTo(px + hr*0.21, crownBase - hr*(0.5 + (i===2?0.2:0)));
      ctx.lineTo(px + hr*0.42, crownBase);
      ctx.fill();
    }
    ctx.fillStyle = '#E53935';
    ctx.beginPath();
    ctx.arc(cx, crownBase + hr*0.12, hr*0.08, 0, Math.PI*2);
    ctx.fill();
  } else if (style === 'bow') {
    ctx.fillStyle = '#F06292';
    const bx = cx + hr*0.6, by = topY + hr*0.15;
    ctx.beginPath();
    ctx.ellipse(bx - hr*0.25, by, hr*0.3, hr*0.18, -0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bx + hr*0.25, by, hr*0.3, hr*0.18, 0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#E91E63';
    ctx.beginPath();
    ctx.arc(bx, by, hr*0.12, 0, Math.PI*2);
    ctx.fill();
  } else if (style === 'sunhat') {
    ctx.fillStyle = '#D4A843';
    // Dome
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.25, hr*1.05, hr*0.55, 0, Math.PI, Math.PI*2);
    ctx.fill();
    // Wide brim
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.35, hr*1.7, hr*0.2, 0, 0, Math.PI*2);
    ctx.fill();
    // Band
    ctx.strokeStyle = '#A0522D';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, topY + hr*0.3, hr*1.05, hr*0.1, 0, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawCreatorCharacter(cx, cy, scale, time) {
  const s = 60 * scale;
  const bob = Math.sin(time * 0.003) * 3 * scale;
  const bt = player.bodyType;
  const [sw, hw, lm] = BODY_PROPS[bt] || BODY_PROPS.athletic;

  // Hair that goes behind the body (drawn first)
  const hs = player.hairStyle;
  if (hs === 'long' || hs === 'wavy' || hs === 'afro') {
    drawHair(cx, cy, s, bob, hs, player.hairColor);
  }

  // Suit body (locked) - shape varies with body type
  const bw = s * sw;
  const hipW = s * hw;
  ctx.fillStyle = '#455A64';
  // Torso (tapered)
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.5, cy - s*0.22 + bob);
  ctx.lineTo(cx + bw*0.5, cy - s*0.22 + bob);
  ctx.lineTo(cx + hipW*0.5, cy + s*0.25 + bob);
  ctx.lineTo(cx - hipW*0.5, cy + s*0.25 + bob);
  ctx.closePath();
  ctx.fill();
  // Suit highlight stripe
  ctx.fillStyle = '#546E7A';
  ctx.beginPath();
  ctx.roundRect(cx - bw*0.12, cy - s*0.18 + bob, bw*0.24, s*0.38, 4*scale);
  ctx.fill();

  // Arms
  const armSwing = Math.sin(time * 0.004) * 0.2;
  const armW = s * 0.1;
  const armLen = s * 0.35;
  const shoulderX = bw * 0.52;
  const shoulderY2 = cy - s*0.18 + bob;
  // Left arm
  ctx.save();
  ctx.translate(cx - shoulderX, shoulderY2);
  ctx.rotate(-0.15 - armSwing);
  ctx.fillStyle = '#455A64'; // suit sleeve
  ctx.beginPath();
  ctx.roundRect(-armW/2, 0, armW, armLen * 0.5, 3*scale);
  ctx.fill();
  ctx.fillStyle = player.color; // skin forearm
  ctx.beginPath();
  ctx.roundRect(-armW/2, armLen * 0.5, armW, armLen * 0.5, 3*scale);
  ctx.fill();
  // Hand
  ctx.beginPath();
  ctx.arc(0, armLen + 2*scale, armW * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Right arm
  ctx.save();
  ctx.translate(cx + shoulderX, shoulderY2);
  ctx.rotate(0.15 + armSwing);
  ctx.fillStyle = '#455A64';
  ctx.beginPath();
  ctx.roundRect(-armW/2, 0, armW, armLen * 0.5, 3*scale);
  ctx.fill();
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.roundRect(-armW/2, armLen * 0.5, armW, armLen * 0.5, 3*scale);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, armLen + 2*scale, armW * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Legs (long!)
  const legLen = s * 0.75 * lm;
  const legW = s * 0.14;
  ctx.fillStyle = '#37474F';
  ctx.beginPath();
  ctx.roundRect(cx - hipW*0.42, cy + s*0.22 + bob, legW, legLen, 5*scale);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(cx + hipW*0.42 - legW, cy + s*0.22 + bob, legW, legLen, 5*scale);
  ctx.fill();

  // Boots (locked, ugly brown)
  const bootY = cy + s*0.22 + legLen + bob;
  ctx.fillStyle = '#5D4037';
  ctx.beginPath();
  ctx.roundRect(cx - hipW*0.42 - s*0.04, bootY, legW + s*0.1, s*0.2, 5*scale);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(cx + hipW*0.42 - legW - s*0.04, bootY, legW + s*0.1, s*0.2, 5*scale);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(cx - hipW*0.42, bootY + s*0.01, s*0.06, s*0.04);
  ctx.fillRect(cx + hipW*0.42 - legW, bootY + s*0.01, s*0.06, s*0.04);

  // Neck
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.roundRect(cx - s*0.08, cy - s*0.38 + bob, s*0.16, s*0.18, 3*scale);
  ctx.fill();

  // Head
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*0.52 + bob, s*0.27, s*0.27, 0, 0, Math.PI*2);
  ctx.fill();
  // Subtle shading
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.beginPath();
  ctx.ellipse(cx + s*0.06, cy - s*0.47 + bob, s*0.18, s*0.2, 0.3, 0, Math.PI*2);
  ctx.fill();

  // Hair (non-behind styles drawn over head)
  if (hs !== 'long' && hs !== 'wavy' && hs !== 'afro') {
    drawHair(cx, cy, s, bob, hs, player.hairColor);
  }

  // Hat drawn over hair
  drawHat(cx, cy, s, bob, player.hatStyle, player.hairColor);

  // Eyes
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.ellipse(cx - s*0.1,  cy - s*0.55 + bob, s*0.07, s*0.055, 0, 0, Math.PI*2);
  ctx.ellipse(cx + s*0.1,  cy - s*0.55 + bob, s*0.07, s*0.055, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(cx - s*0.1, cy - s*0.55 + bob, s*0.04, 0, Math.PI*2);
  ctx.arc(cx + s*0.1, cy - s*0.55 + bob, s*0.04, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx - s*0.08, cy - s*0.57 + bob, s*0.015, 0, Math.PI*2);
  ctx.arc(cx + s*0.12, cy - s*0.57 + bob, s*0.015, 0, Math.PI*2);
  ctx.fill();

  // Eyebrows
  const eyebrowColor = HAIR_COLORS[player.hairColorIdx].replace('#E8E8E8','#999').replace('#B8B8B8','#888');
  ctx.strokeStyle = eyebrowColor;
  ctx.lineWidth = 1.8 * scale;
  ctx.lineCap = 'round';
  const face = player.faceStyle;
  if (face === 'surprised') {
    ctx.beginPath();
    ctx.arc(cx - s*0.1, cy - s*0.63 + bob, s*0.06, Math.PI+0.3, Math.PI*2-0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + s*0.1, cy - s*0.63 + bob, s*0.06, Math.PI+0.3, Math.PI*2-0.3);
    ctx.stroke();
  } else if (face === 'determined') {
    ctx.beginPath();
    ctx.moveTo(cx - s*0.16, cy - s*0.61 + bob);
    ctx.lineTo(cx - s*0.04, cy - s*0.64 + bob);
    ctx.moveTo(cx + s*0.04, cy - s*0.64 + bob);
    ctx.lineTo(cx + s*0.16, cy - s*0.61 + bob);
    ctx.stroke();
  } else if (face === 'cool') {
    ctx.beginPath();
    ctx.moveTo(cx - s*0.17, cy - s*0.63 + bob);
    ctx.lineTo(cx - s*0.04, cy - s*0.63 + bob);
    ctx.moveTo(cx + s*0.04, cy - s*0.63 + bob);
    ctx.lineTo(cx + s*0.17, cy - s*0.63 + bob);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(cx - s*0.1, cy - s*0.61 + bob, s*0.07, Math.PI+0.5, Math.PI*2-0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + s*0.1, cy - s*0.61 + bob, s*0.07, Math.PI+0.5, Math.PI*2-0.5);
    ctx.stroke();
  }

  // Nose
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1 * scale;
  ctx.beginPath();
  ctx.arc(cx + s*0.04, cy - s*0.48 + bob, s*0.04, 0.5, Math.PI-0.5);
  ctx.stroke();

  // Mouth
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.6 * scale;
  ctx.lineCap = 'round';
  if (face === 'happy') {
    ctx.beginPath();
    ctx.arc(cx, cy - s*0.42 + bob, s*0.1, 0.15, Math.PI-0.15);
    ctx.stroke();
  } else if (face === 'cool') {
    ctx.beginPath();
    ctx.moveTo(cx - s*0.09, cy - s*0.43 + bob);
    ctx.lineTo(cx + s*0.09, cy - s*0.43 + bob);
    ctx.stroke();
  } else if (face === 'grin') {
    ctx.beginPath();
    ctx.arc(cx, cy - s*0.41 + bob, s*0.12, 0.05, Math.PI-0.05);
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.fillRect(cx - s*0.09, cy - s*0.44 + bob, s*0.18, s*0.055);
  } else if (face === 'surprised') {
    ctx.beginPath();
    ctx.ellipse(cx, cy - s*0.42 + bob, s*0.07, s*0.09, 0, 0, Math.PI*2);
    ctx.stroke();
  } else if (face === 'determined') {
    ctx.beginPath();
    ctx.moveTo(cx - s*0.09, cy - s*0.41 + bob);
    ctx.lineTo(cx + s*0.09, cy - s*0.41 + bob);
    ctx.stroke();
  } else if (face === 'soft') {
    ctx.beginPath();
    ctx.arc(cx, cy - s*0.43 + bob, s*0.07, 0.3, Math.PI-0.3);
    ctx.stroke();
  }
}

// ============ TITLE SCREEN ============
let titleParticles = [];
let titleEyes = [];
let titleTentacles = [];
let titleInited = false;

function initTitle() {
  if (titleInited) return;
  titleInited = true;
  // Floating particles (bioluminescence)
  for (let i = 0; i < 60; i++) {
    titleParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 1 + Math.random() * 3,
      speed: 0.2 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      color: ['#4FC3F7', '#CE93D8', '#76FF03', '#FFEB3B', '#E040FB'][Math.floor(Math.random() * 5)],
      alpha: 0.1 + Math.random() * 0.5,
    });
  }
  // Glowing eyes peering from the darkness
  const eyeConfigs = [
    // Top-left corner
    { x: W * 0.06, y: H * 0.15, size: 8, color: '#FFEB3B', pupil: '#000' },
    { x: W * 0.09, y: H * 0.14, size: 7, color: '#FFEB3B', pupil: '#000' },
    // Top-right corner
    { x: W * 0.92, y: H * 0.12, size: 5, color: '#FF5252', pupil: '#000' },
    { x: W * 0.94, y: H * 0.11, size: 4, color: '#FF5252', pupil: '#000' },
    // Left edge, mid-low
    { x: W * 0.04, y: H * 0.6, size: 6, color: '#E040FB', pupil: '#220022' },
    { x: W * 0.06, y: H * 0.59, size: 5, color: '#E040FB', pupil: '#220022' },
    // Right edge, mid
    { x: W * 0.93, y: H * 0.5, size: 10, color: '#76FF03', pupil: '#111' },
    { x: W * 0.96, y: H * 0.49, size: 9, color: '#76FF03', pupil: '#111' },
    // Bottom corners - big slit eyes
    { x: W * 0.08, y: H * 0.9, size: 14, color: '#FFEB3B', pupil: '#000', slit: true },
    { x: W * 0.14, y: H * 0.89, size: 12, color: '#FFEB3B', pupil: '#000', slit: true },
    // Bottom-right
    { x: W * 0.9, y: H * 0.88, size: 8, color: '#76FF03', pupil: '#111' },
    { x: W * 0.93, y: H * 0.87, size: 7, color: '#76FF03', pupil: '#111' },
  ];
  titleEyes = eyeConfigs;
  // Tentacles reaching from edges
  for (let i = 0; i < 6; i++) {
    const fromRight = i % 2 === 0;
    titleTentacles.push({
      startX: fromRight ? W + 20 : -20,
      startY: H * 0.2 + i * H * 0.13,
      length: W * 0.3 + Math.random() * W * 0.15,
      thickness: 6 + Math.random() * 8,
      phase: Math.random() * Math.PI * 2,
      dir: fromRight ? -1 : 1,
      color: ['#4A148C', '#1A237E', '#37474F', '#B71C1C'][Math.floor(Math.random() * 4)],
    });
  }
}

function drawTitle(time) {
  initTitle();

  // Deep ocean gradient background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#020210');
  bg.addColorStop(0.3, '#050520');
  bg.addColorStop(0.6, '#0a0a30');
  bg.addColorStop(1, '#000008');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle underwater caustic light from above
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 5; i++) {
    const rx = W * 0.15 + i * W * 0.18 + Math.sin(time * 0.0005 + i) * 30;
    ctx.beginPath();
    ctx.moveTo(rx, 0);
    ctx.lineTo(rx - 40, H);
    ctx.lineTo(rx + 40, H);
    ctx.closePath();
    ctx.fillStyle = '#4FC3F7';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Tentacles
  titleTentacles.forEach(t => {
    const wave = Math.sin(time * 0.001 + t.phase);
    ctx.strokeStyle = t.color;
    ctx.lineWidth = t.thickness;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(t.startX, t.startY);
    const segments = 8;
    for (let s = 1; s <= segments; s++) {
      const frac = s / segments;
      const sx = t.startX + t.dir * t.length * frac;
      const sy = t.startY + Math.sin(time * 0.002 + t.phase + s * 0.8) * 25 * frac;
      ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    // Thinner overlay
    ctx.lineWidth = t.thickness * 0.4;
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = '#CE93D8';
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // Floating particles
  titleParticles.forEach(p => {
    p.y -= p.speed;
    p.x += Math.sin(time * 0.001 + p.phase) * 0.3;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    const pulse = p.alpha + Math.sin(time * 0.003 + p.phase) * 0.2;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, pulse);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Glowing eyes
  titleEyes.forEach(eye => {
    const blink = Math.sin(time * 0.002 + eye.x * 0.01);
    if (blink < -0.95) return; // blink closed
    const lookX = Math.sin(time * 0.001 + eye.y * 0.005) * eye.size * 0.2;
    const glowPulse = 0.3 + Math.sin(time * 0.003 + eye.phase) * 0.15;
    // Glow
    ctx.fillStyle = eye.color;
    ctx.globalAlpha = glowPulse;
    ctx.beginPath();
    ctx.arc(eye.x, eye.y, eye.size * 2.5, 0, Math.PI * 2);
    ctx.fill();
    // Eye white
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = eye.color;
    ctx.beginPath();
    ctx.arc(eye.x, eye.y, eye.size, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = eye.pupil;
    ctx.globalAlpha = 1;
    if (eye.slit) {
      ctx.beginPath();
      ctx.ellipse(eye.x + lookX, eye.y, eye.size * 0.2, eye.size * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(eye.x + lookX, eye.y, eye.size * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  // Dark vignette overlay
  const vig = ctx.createRadialGradient(W / 2, H * 0.38, W * 0.15, W / 2, H / 2, W * 0.7);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Title text with glow
  ctx.textAlign = 'center';

  // Title glow
  const titleGlow = 0.6 + Math.sin(time * 0.002) * 0.2;
  ctx.shadowColor = '#4FC3F7';
  ctx.shadowBlur = 30 * titleGlow;

  // Main title
  ctx.fillStyle = '#E3F2FD';
  ctx.font = 'bold ' + Math.min(52, W * 0.12) + 'px sans-serif';
  ctx.fillText('AQUARIUM', W / 2, H * 0.28);

  ctx.shadowBlur = 20 * titleGlow;
  ctx.fillStyle = '#4FC3F7';
  ctx.font = 'bold ' + Math.min(36, W * 0.08) + 'px sans-serif';
  ctx.fillText('ADVENTURE', W / 2, H * 0.36);

  ctx.shadowColor = '#E040FB';
  ctx.shadowBlur = 15;

  // Subtitle
  ctx.fillStyle = '#CE93D8';
  ctx.font = Math.min(16, W * 0.04) + 'px sans-serif';
  ctx.fillText('Dive into the depths... if you dare', W / 2, H * 0.43);

  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  // "Tap to start" pulsing
  const startPulse = 0.5 + Math.sin(time * 0.004) * 0.5;
  ctx.fillStyle = `rgba(255,255,255,${0.4 + startPulse * 0.5})`;
  ctx.font = 'bold ' + Math.min(20, W * 0.05) + 'px sans-serif';
  ctx.fillText('TAP TO START', W / 2, H * 0.58);

  // Credits
  ctx.fillStyle = 'rgba(206,147,216,0.7)';
  ctx.font = Math.min(14, W * 0.035) + 'px sans-serif';
  ctx.fillText('A game by', W / 2, H * 0.72);

  ctx.fillStyle = '#E0E0E0';
  ctx.font = 'bold ' + Math.min(18, W * 0.045) + 'px sans-serif';
  ctx.fillText('Alicia, Carrie, Willa & Cora', W / 2, H * 0.77);

  // Small creature silhouettes swimming across bottom
  const silY = H * 0.9;
  for (let i = 0; i < 3; i++) {
    const sx = ((time * 0.02 + i * W * 0.35) % (W + 100)) - 50;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.ellipse(sx, silY + Math.sin(time * 0.002 + i) * 8, 25 + i * 5, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail
    ctx.beginPath();
    ctx.moveTo(sx - 25 - i * 5, silY + Math.sin(time * 0.002 + i) * 8);
    ctx.lineTo(sx - 40 - i * 5, silY - 8 + Math.sin(time * 0.003 + i) * 5);
    ctx.lineTo(sx - 40 - i * 5, silY + 8 + Math.sin(time * 0.003 + i) * 5);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCreator(time) {
  creatorButtons = [];

  // Background
  ctx.fillStyle = '#001528';
  ctx.fillRect(0, 0, W, H);

  // Subtle light rays
  for (let i = 0; i < 5; i++) {
    const rx = W * (0.1 + i * 0.2);
    ctx.beginPath();
    ctx.moveTo(rx, 0);
    ctx.lineTo(rx - 60, H);
    ctx.lineTo(rx + 60, H);
    ctx.closePath();
    ctx.fillStyle = 'rgba(79,195,247,0.015)';
    ctx.fill();
  }

  // Bubbles
  for (let i = 0; i < 10; i++) {
    const bx = (i * 137 + 50) % W;
    const by = H - ((i * 89 + time * 0.02 * (0.3 + i*0.05)) % H);
    ctx.beginPath();
    ctx.arc(bx, by, 2 + (i%4)*1.5, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(100,200,255,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#4FC3F7';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('CREATE YOUR DIVER', W/2, 38);

  // Preview on left side
  const previewX = Math.min(W * 0.2, 180);
  const previewY = H * 0.45;
  const scale = Math.min(1.1, H / 700);
  const ps = 60 * scale;

  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.strokeStyle = 'rgba(79,195,247,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(previewX - ps*0.9, previewY - ps*1.0, ps*1.8, ps*2.6, 14);
  ctx.fill();
  ctx.stroke();

  drawCreatorCharacter(previewX, previewY, scale, time);

  // Options panel on right side -- clean simple grid
  const SW = 34, SH = 34, GAP = 7, STEP = SW + GAP;
  const ox = Math.min(W * 0.38, previewX + ps + 24);
  const availW = W - ox - 14;
  const perRow = Math.max(1, Math.floor(availW / STEP));

  function drawRow(label, items, selIdx, isColor, colorArr, startY, onChange) {
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#7FBBDD';
    ctx.fillText(label, ox, startY - 3);
    items.forEach(function(item, i) {
      const col = i % perRow;
      const rn = Math.floor(i / perRow);
      const bx = ox + col * STEP;
      const by = startY + rn * (SH + 5);
      const sel = (i === selIdx);
      ctx.fillStyle = sel ? 'rgba(79,195,247,0.3)' : 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.roundRect(bx, by, SW, SH, 7);
      ctx.fill();
      if (sel) {
        ctx.strokeStyle = '#4FC3F7';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (isColor) {
        ctx.fillStyle = colorArr[i];
        ctx.beginPath();
        ctx.arc(bx + SW/2, by + SH/2, 12, 0, Math.PI*2);
        ctx.fill();
        if (i >= 9) {
          ctx.fillStyle = 'rgba(255,220,50,0.7)';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('fun', bx + SW/2, by + SH - 3);
          ctx.textAlign = 'left';
        }
      } else {
        ctx.fillStyle = sel ? 'white' : '#bbb';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item, bx + SW/2, by + SH/2 + 4);
        ctx.textAlign = 'left';
      }
      const captured = i;
      creatorButtons.push({ x: bx, y: by, w: SW, h: SH, fn: function() { onChange(captured); } });
    });
    const totalRows = Math.ceil(items.length / perRow);
    return startY + totalRows * (SH + 5) + 14;
  }

  let ry = 54;
  ry = drawRow('Skin Tone', SKIN_TONES, player.skinIdx, true, SKIN_TONES, ry, function(i){ player.skinIdx=i; });
  ry = drawRow('Hair Color  (natural first, fun at end)', HAIR_COLORS, player.hairColorIdx, true, HAIR_COLORS, ry, function(i){ player.hairColorIdx=i; });
  ry = drawRow('Hair Style', ['Short','Bob','Curly','Afro','Long','Wavy','Spiky','Bun','Braids'], player.hairStyleIdx, false, null, ry, function(i){ player.hairStyleIdx=i; });
  ry = drawRow('Face', ['Happy','Cool','Grin','Surprised','Determined','Soft'], player.faceIdx, false, null, ry, function(i){ player.faceIdx=i; });
  ry = drawRow('Hat', ['None','Beanie','Bucket','Cap','Crown','Bow','Sun Hat'], player.hatIdx, false, null, ry, function(i){ player.hatIdx=i; });
  ry = drawRow('Body Type', ['Slim','Athletic','Curvy','Stocky'], player.bodyIdx, false, null, ry, function(i){ player.bodyIdx=i; });

  ctx.textAlign = 'left';
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#555';
  ctx.fillText('Suit & Boots: locked for now 🔒', ox, ry + 4);

  // Start button
  const btnW = 220, btnH = 48;
  const btnX = W/2 - btnW/2;
  const btnY = H - 60;
  const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY+btnH);
  grad.addColorStop(0, '#00C853');
  grad.addColorStop(1, '#007E33');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, btnW, btnH, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 19px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('START ADVENTURE! 🌊', W/2, btnY + 31);
  creatorButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, fn: startGame });
}

function startGame() {
  STATE.scene = 'beach';
  player.x = W * 0.2;
  player.y = H * 0.7;
  player.targetX = player.x;
  player.targetY = player.y;
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('inventory-btn').style.display = 'flex';
  // Start visitor spawning on the beach
  initTankFish();
  if (visitorSpawnTimer) clearInterval(visitorSpawnTimer);
  scheduleNextVisitor();
}

function scheduleNextVisitor() {
  const rate = getVisitorSpawnRate();
  visitorSpawnTimer = setTimeout(() => {
    if (STATE.scene === 'beach' || STATE.scene === 'aquarium') {
      if (beachVisitors.length < 5) spawnBeachVisitor();
    }
    scheduleNextVisitor();
  }, rate);
}

function spawnBosses() {
  bosses = [];
  // Zone ranges for boss placement
  const zoneRanges = {
    kelp:  { startY: 650, endY: 1150 },
    open:  { startY: 1300, endY: 1900 },
    deep:  { startY: 2100, endY: 2900 },
  };
  // Group bosses by zone, pick 1-2 per zone
  const byZone = {};
  BOSS_TYPES.forEach(t => {
    if (!byZone[t.bossZone]) byZone[t.bossZone] = [];
    byZone[t.bossZone].push(t);
  });
  for (const [zone, types] of Object.entries(byZone)) {
    const range = zoneRanges[zone];
    if (!range) continue;
    // Shuffle and pick 1-2
    const shuffled = [...types].sort(() => Math.random() - 0.5);
    const count = Math.min(shuffled.length, 1 + Math.floor(Math.random() * 2));
    for (let i = 0; i < count; i++) {
      const type = shuffled[i];
      bosses.push({
        ...type,
        zone: zone,
        x: 60 + Math.random() * (W - 120),
        y: range.startY + Math.random() * (range.endY - range.startY),
        dx: (Math.random() > 0.5 ? 1 : -1) * type.speed,
        dy: (Math.random() - 0.5) * type.speed * 0.3,
        phase: Math.random() * Math.PI * 2,
        alive: true,
        minY: range.startY,
        maxY: range.endY,
        isBoss: true,
      });
    }
  }
}

function drawBoss(b, time, screenY) {
  const x = b.x;
  const y = screenY;
  const s = b.size;
  const dir = b.dx >= 0 ? 1 : -1;

  ctx.save();
  ctx.translate(x, y);

  // Ominous glow (all bosses get this)
  const pulseAlpha = 0.1 + Math.sin(time * 0.003 + b.phase) * 0.05;
  const glow = ctx.createRadialGradient(0, 0, s * 0.3, 0, 0, s * 1.5);
  glow.addColorStop(0, `rgba(224,64,251,${pulseAlpha})`);
  glow.addColorStop(1, 'rgba(224,64,251,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, s * 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Dispatch based on shape
  if (b.shape === 'deepbeast') {
    ctx.scale(dir, 1);
    drawDeepBeast(ctx, s, b.colors, time, b.phase);
  } else if (b.shape === 'seadragon') {
    ctx.scale(dir, 1);
    drawSeaDragon(ctx, s, b.colors, time, b.phase);
  } else if (b.shape === 'abyssaleye') {
    drawAbyssalEye(ctx, s, b.colors, time, b.phase);
  } else {
    // Default fan-tentacle boss
    ctx.scale(dir, 1);
    drawFanTentacleBoss(ctx, s, b.colors, time, b.phase, b.bossSize);
  }

  ctx.restore();
}

function drawFanTentacleBoss(ctx, s, colors, time, phase, bossSize) {
  // Radiating leaf tentacles (fan shape, from Willa's drawing)
  const tentacleCount = bossSize === 'large' ? 10 : bossSize === 'medium' ? 8 : 6;
  for (let i = 0; i < tentacleCount; i++) {
    const angle = -Math.PI * 0.8 + (i / (tentacleCount - 1)) * Math.PI * 1.6;
    const wave = Math.sin(time * 0.003 + phase + i * 0.5) * 0.15;
    const len = s * (0.8 + (bossSize === 'large' ? 0.4 : bossSize === 'medium' ? 0.2 : 0));
    const tipX = Math.cos(angle + wave) * len;
    const tipY = Math.sin(angle + wave) * len;
    const midX = Math.cos(angle + wave) * len * 0.5;
    const midY = Math.sin(angle + wave) * len * 0.5;

    // Leaf-shaped tentacle
    ctx.fillStyle = colors[2];
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(midX + Math.sin(angle) * s * 0.15, midY - Math.cos(angle) * s * 0.15, tipX, tipY);
    ctx.quadraticCurveTo(midX - Math.sin(angle) * s * 0.15, midY + Math.cos(angle) * s * 0.15, 0, 0);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Center vein on each leaf
    ctx.strokeStyle = colors[1];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(tipX * 0.9, tipY * 0.9);
    ctx.stroke();
  }

  // Square body (from Willa's drawing)
  const bodyW = s * 0.45;
  const bodyH = s * 0.5;
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.roundRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH, s * 0.08);
  ctx.fill();

  // Body pattern (cross-hatch)
  ctx.strokeStyle = colors[1];
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  for (let g = -bodyW / 2 + 6; g < bodyW / 2; g += 8) {
    ctx.beginPath();
    ctx.moveTo(g, -bodyH / 2 + 3);
    ctx.lineTo(g, bodyH / 2 - 3);
    ctx.stroke();
  }
  for (let g = -bodyH / 2 + 6; g < bodyH / 2; g += 8) {
    ctx.beginPath();
    ctx.moveTo(-bodyW / 2 + 3, g);
    ctx.lineTo(bodyW / 2 - 3, g);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Curly antennae
  for (let side = -1; side <= 1; side += 2) {
    ctx.strokeStyle = colors[2];
    ctx.lineWidth = 3;
    ctx.beginPath();
    const ax = side * bodyW * 0.25;
    const ay = -bodyH / 2;
    const curl = Math.sin(time * 0.004 + phase + side) * 5;
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(ax + side * s * 0.15 + curl, ay - s * 0.3, ax + side * s * 0.25 + curl * 1.5, ay - s * 0.15);
    ctx.stroke();
    ctx.fillStyle = colors[2];
    ctx.beginPath();
    ctx.arc(ax + side * s * 0.25 + curl * 1.5, ay - s * 0.15, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Eyes (menacing)
  ctx.fillStyle = '#FFEB3B';
  ctx.beginPath();
  ctx.ellipse(-bodyW * 0.18, -bodyH * 0.1, s * 0.06, s * 0.07, 0, 0, Math.PI * 2);
  ctx.ellipse(bodyW * 0.18, -bodyH * 0.1, s * 0.06, s * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(-bodyW * 0.18, -bodyH * 0.1, s * 0.02, s * 0.06, 0, 0, Math.PI * 2);
  ctx.ellipse(bodyW * 0.18, -bodyH * 0.1, s * 0.02, s * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();

  // Angry mouth
  ctx.strokeStyle = '#FFEB3B';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.2, bodyH * 0.15);
  ctx.lineTo(-bodyW * 0.08, bodyH * 0.22);
  ctx.lineTo(0, bodyH * 0.15);
  ctx.lineTo(bodyW * 0.08, bodyH * 0.22);
  ctx.lineTo(bodyW * 0.2, bodyH * 0.15);
  ctx.stroke();
}

let mermaids = [];
let nearMermaid = null;

function spawnMermaids() {
  mermaids = [
    {
      x: W * 0.3,
      y: 250,
      dx: 0.4,
      dy: 0,
      phase: 0,
      hairColor: '#E040FB',
      tailColor: '#7C4DFF',
      skinColor: '#FDDBB4',
      name: 'Coral',
    },
    {
      x: W * 0.7,
      y: 400,
      dx: -0.3,
      dy: 0,
      phase: Math.PI,
      hairColor: '#4FC3F7',
      tailColor: '#00BCD4',
      skinColor: '#F0C27F',
      name: 'Marina',
    },
  ];
}

function drawMermaid(m, time, screenY) {
  const x = m.x;
  const y = screenY;
  const s = 40;
  const bob = Math.sin(time * 0.002 + m.phase) * 4;
  const dir = m.dx >= 0 ? 1 : -1;

  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(dir, 1);

  // Tail (fish tail with flowing fin)
  const tailWag = Math.sin(time * 0.004 + m.phase) * 12;
  ctx.fillStyle = m.tailColor;
  // Main tail body
  ctx.beginPath();
  ctx.moveTo(0, s * 0.1);
  ctx.quadraticCurveTo(s * 0.1, s * 0.5, tailWag * 0.3, s * 0.8);
  ctx.quadraticCurveTo(tailWag * 0.5, s * 1.0, tailWag * 0.3 - s * 0.2, s * 1.2);
  ctx.lineTo(tailWag * 0.3 + s * 0.2, s * 1.2);
  ctx.quadraticCurveTo(tailWag * 0.5, s * 1.0, tailWag * 0.3, s * 0.8);
  ctx.quadraticCurveTo(-s * 0.1, s * 0.5, 0, s * 0.1);
  ctx.fill();
  // Tail fin (forked)
  ctx.beginPath();
  ctx.moveTo(tailWag * 0.3, s * 1.1);
  ctx.quadraticCurveTo(tailWag * 0.5 - s * 0.3, s * 1.4, tailWag * 0.3 - s * 0.35, s * 1.35);
  ctx.quadraticCurveTo(tailWag * 0.4, s * 1.15, tailWag * 0.3 + s * 0.35, s * 1.35);
  ctx.quadraticCurveTo(tailWag * 0.5 + s * 0.3, s * 1.4, tailWag * 0.3, s * 1.1);
  ctx.fill();

  // Torso (human upper body)
  ctx.fillStyle = m.skinColor;
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.05, s * 0.22, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Top (shell bikini)
  ctx.fillStyle = '#E040FB';
  ctx.beginPath();
  ctx.arc(-s * 0.1, -s * 0.05, s * 0.09, 0, Math.PI * 2);
  ctx.arc(s * 0.1, -s * 0.05, s * 0.09, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(-s * 0.1, -s * 0.05, s * 0.09, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(s * 0.1, -s * 0.05, s * 0.09, 0, Math.PI * 2);
  ctx.stroke();

  // Arms
  ctx.fillStyle = m.skinColor;
  const armWave = Math.sin(time * 0.003 + m.phase) * 0.3;
  // Left arm
  ctx.save();
  ctx.translate(-s * 0.22, -s * 0.1);
  ctx.rotate(-0.4 + armWave);
  ctx.beginPath();
  ctx.ellipse(0, s * 0.15, s * 0.06, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Right arm
  ctx.save();
  ctx.translate(s * 0.22, -s * 0.1);
  ctx.rotate(0.4 - armWave);
  ctx.beginPath();
  ctx.ellipse(0, s * 0.15, s * 0.06, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Head
  ctx.fillStyle = m.skinColor;
  ctx.beginPath();
  ctx.arc(0, -s * 0.45, s * 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Hair (long flowing behind)
  ctx.fillStyle = m.hairColor;
  const hairWave = Math.sin(time * 0.002 + m.phase) * 8;
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.55, s * 0.22, s * 0.14, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // Flowing strands
  for (let strand = -1; strand <= 1; strand++) {
    ctx.beginPath();
    ctx.moveTo(strand * s * 0.15, -s * 0.45);
    ctx.quadraticCurveTo(
      strand * s * 0.3 + hairWave * 0.5, -s * 0.1,
      strand * s * 0.25 + hairWave, s * 0.3
    );
    ctx.quadraticCurveTo(
      strand * s * 0.2 + hairWave * 0.8, s * 0.35,
      strand * s * 0.15 + hairWave * 0.6, s * 0.4
    );
    ctx.lineWidth = s * 0.08;
    ctx.strokeStyle = m.hairColor;
    ctx.stroke();
  }

  // Eyes
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.ellipse(-s * 0.08, -s * 0.47, s * 0.055, s * 0.04, 0, 0, Math.PI * 2);
  ctx.ellipse(s * 0.08, -s * 0.47, s * 0.055, s * 0.04, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(-s * 0.08, -s * 0.47, s * 0.025, 0, Math.PI * 2);
  ctx.arc(s * 0.08, -s * 0.47, s * 0.025, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, -s * 0.4, s * 0.08, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Sparkle/glow around mermaid
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.9, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(206,147,216,0.08)';
  ctx.fill();

  ctx.restore();
}

let oceanFish = [];

let bubbles = [];
let selectedTarget = null;

// ============ CONTINUOUS OCEAN ============
// The ocean is one tall world. Depth determines zone.
// OCEAN_DEPTH is the total world height in pixels.
const OCEAN_DEPTH = 3000;
let cameraY = 0; // top of viewport in world coords

// Zone boundaries (in world Y coords, top = 0)
const ZONE_BANDS = [
  { zone: 'coral',  startY: 0,    endY: 600,  label: '🐠 Sunlight Zone' },
  { zone: 'kelp',   startY: 600,  endY: 1200, label: '🌿 Kelp Forest' },
  { zone: 'open',   startY: 1200, endY: 2000, label: '🐬 Open Ocean' },
  { zone: 'deep',   startY: 2000, endY: 3000, label: '🦑 The Deep' },
];

function getZoneAtDepth(worldY) {
  for (const band of ZONE_BANDS) {
    if (worldY >= band.startY && worldY < band.endY) return band;
  }
  return ZONE_BANDS[ZONE_BANDS.length - 1];
}

function spawnAllOceanLife() {
  oceanFish = [];
  oceanDecos = [];

  // Spawn fish in each zone band
  ZONE_BANDS.forEach(band => {
    const types = FISH_TYPES[band.zone] || FISH_TYPES.coral;
    const count = 8 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      const type = types[Math.floor(Math.random() * types.length)];
      const bandH = band.endY - band.startY;
      oceanFish.push({
        ...type,
        zone: band.zone,
        x: Math.random() * W,
        y: band.startY + 40 + Math.random() * (bandH - 80),
        dx: (Math.random() - 0.5) * type.speed * 2,
        dy: (Math.random() - 0.5) * type.speed * 0.3,
        phase: Math.random() * Math.PI * 2,
        alive: true,
        minY: band.startY + 20,
        maxY: band.endY - 20,
      });
    }

    // Decos on the "floor" of each zone
    const decoTypes = DECO_TYPES[band.zone] || DECO_TYPES.coral;
    const decoCount = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < decoCount; i++) {
      const type = decoTypes[Math.floor(Math.random() * decoTypes.length)];
      oceanDecos.push({
        ...type,
        x: 50 + Math.random() * (W - 100),
        y: band.endY - 30 + Math.random() * 20,
        collected: false,
      });
    }
  });

  // Spawn mermaids in the coral reef zone
  spawnMermaids();

  // Spawn bosses in The Deep
  spawnBosses();

  // Also add decos on the seabed at the very bottom
  const bottomDecos = DECO_TYPES.deep;
  for (let i = 0; i < 5; i++) {
    const type = bottomDecos[Math.floor(Math.random() * bottomDecos.length)];
    oceanDecos.push({
      ...type,
      x: 50 + Math.random() * (W - 100),
      y: OCEAN_DEPTH - 50 + Math.random() * 30,
      collected: false,
    });
  }
}

// ============ BEACH SCENE ============
let beachWaves = [];
for (let i = 0; i < 5; i++) {
  beachWaves.push({ offset: Math.random() * Math.PI * 2, speed: 0.004 + Math.random() * 0.002 });
}

let clouds = [];
for (let i = 0; i < 4; i++) {
  clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 80, size: 40 + Math.random() * 30, speed: 0.3 + Math.random() * 0.3 });
}

let palmTrees = [
  { x: 0.1, trunkH: 120 },
  { x: 0.85, trunkH: 100 },
];

function drawBeach(time) {
  // Sky gradient (warm, with horizon glow)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.48);
  skyGrad.addColorStop(0, '#4A90D9');
  skyGrad.addColorStop(0.5, '#7BB8F0');
  skyGrad.addColorStop(0.8, '#B8D8F8');
  skyGrad.addColorStop(1, '#E8D5B7');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Horizon haze
  ctx.fillStyle = 'rgba(255,240,210,0.25)';
  ctx.fillRect(0, H * 0.38, W, H * 0.1);

  // Sun with rays
  const sunX = W * 0.8, sunY = H * 0.12;
  // Sun rays
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#FFF9C4';
  for (let r = 0; r < 12; r++) {
    const a = (r / 12) * Math.PI * 2 + time * 0.0002;
    ctx.beginPath();
    ctx.moveTo(sunX, sunY);
    ctx.lineTo(sunX + Math.cos(a) * 120, sunY + Math.sin(a) * 120);
    ctx.lineTo(sunX + Math.cos(a + 0.15) * 120, sunY + Math.sin(a + 0.15) * 120);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Sun glow
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 70);
  sunGlow.addColorStop(0, 'rgba(255,255,200,0.9)');
  sunGlow.addColorStop(0.4, 'rgba(255,241,118,0.3)');
  sunGlow.addColorStop(1, 'rgba(255,241,118,0)');
  ctx.fillStyle = sunGlow;
  ctx.beginPath(); ctx.arc(sunX, sunY, 70, 0, Math.PI * 2); ctx.fill();
  // Sun body
  ctx.fillStyle = '#FFF9C4';
  ctx.beginPath(); ctx.arc(sunX, sunY, 32, 0, Math.PI * 2); ctx.fill();

  // Clouds (softer, layered)
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 100) c.x = -100;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
    ctx.arc(c.x + c.size * 0.7, c.y - 5, c.size * 0.8, 0, Math.PI * 2);
    ctx.arc(c.x - c.size * 0.5, c.y + 3, c.size * 0.65, 0, Math.PI * 2);
    ctx.arc(c.x + c.size * 0.3, c.y - 12, c.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    // Cloud highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(c.x - c.size * 0.2, c.y - c.size * 0.3, c.size * 0.4, 0, Math.PI * 2);
    ctx.fill();
  });

  // Ocean (layered, with depth)
  const oceanY = H * 0.45;
  const oceanGrad = ctx.createLinearGradient(0, oceanY - 10, 0, H * 0.6);
  oceanGrad.addColorStop(0, '#2196F3');
  oceanGrad.addColorStop(0.3, '#1976D2');
  oceanGrad.addColorStop(0.7, '#1565C0');
  oceanGrad.addColorStop(1, '#0D47A1');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, oceanY, W, H * 0.15);

  // Ocean shimmer (light reflections)
  ctx.globalAlpha = 0.08;
  for (let s = 0; s < 15; s++) {
    const sx = (s * 73 + time * 0.004) % W;
    const sy = oceanY + 5 + (s * 17) % (H * 0.1);
    ctx.fillStyle = '#FFF';
    ctx.fillRect(sx, sy, 12 + Math.sin(time * 0.0008 + s) * 5, 2);
  }
  ctx.globalAlpha = 1;

  // Waves (multiple layers for depth)
  // Back wave (darker)
  ctx.beginPath();
  ctx.moveTo(0, oceanY + 3);
  for (let x = 0; x <= W; x += 4) {
    let wy = oceanY + 3;
    beachWaves.forEach(w => { wy += Math.sin(x * 0.012 + time * w.speed * 0.8 + w.offset + 1) * 4; });
    ctx.lineTo(x, wy);
  }
  ctx.lineTo(W, H * 0.6); ctx.lineTo(0, H * 0.6); ctx.closePath();
  ctx.fillStyle = '#1565C0';
  ctx.fill();

  // Front wave
  ctx.beginPath();
  ctx.moveTo(0, oceanY);
  for (let x = 0; x <= W; x += 4) {
    let wy = oceanY;
    beachWaves.forEach(w => { wy += Math.sin(x * 0.015 + time * w.speed + w.offset) * 5; });
    ctx.lineTo(x, wy);
  }
  ctx.lineTo(W, H * 0.6); ctx.lineTo(0, H * 0.6); ctx.closePath();
  ctx.fillStyle = '#1976D2';
  ctx.fill();

  // Foam line along the wave edge
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, oceanY);
  for (let x = 0; x <= W; x += 4) {
    let wy = oceanY;
    beachWaves.forEach(w => { wy += Math.sin(x * 0.015 + time * w.speed + w.offset) * 5; });
    ctx.lineTo(x, wy);
  }
  ctx.stroke();

  // Foam bubbles along shore
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let f = 0; f < 20; f++) {
    const fx = (f * 53 + time * 0.002) % W;
    let fy = oceanY + 2;
    beachWaves.forEach(w => { fy += Math.sin(fx * 0.015 + time * w.speed + w.offset) * 5; });
    ctx.beginPath(); ctx.arc(fx, fy + 2, 2 + Math.sin(time * 0.001 + f) * 1, 0, Math.PI * 2); ctx.fill();
  }

  // Wet sand strip (dark, reflective near water)
  const wetTop = H * 0.54;
  const wetGrad = ctx.createLinearGradient(0, wetTop, 0, H * 0.59);
  wetGrad.addColorStop(0, '#C8A84E');
  wetGrad.addColorStop(0.5, '#D4AD56');
  wetGrad.addColorStop(1, '#E8C36B');
  ctx.fillStyle = wetGrad;
  ctx.fillRect(0, wetTop, W, H * 0.05);

  // Wet sand reflection shimmer
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#FFF';
  for (let r = 0; r < 10; r++) {
    const rx = (r * 89) % W;
    ctx.fillRect(rx, wetTop + 2, 20 + Math.sin(time * 0.002 + r) * 8, 3);
  }
  ctx.globalAlpha = 1;

  // Dry sand
  const sandGrad = ctx.createLinearGradient(0, H * 0.58, 0, H);
  sandGrad.addColorStop(0, '#ECC86B');
  sandGrad.addColorStop(0.2, '#E8C060');
  sandGrad.addColorStop(0.6, '#DEB558');
  sandGrad.addColorStop(1, '#D4A84E');
  ctx.fillStyle = sandGrad;
  ctx.fillRect(0, H * 0.58, W, H * 0.42);

  // Sand texture (varied grain)
  for (let i = 0; i < 80; i++) {
    const sx = (i * 97 + 33) % W;
    const sy = H * 0.59 + ((i * 71 + 17) % (H * 0.38));
    const shade = (i * 31) % 3;
    ctx.fillStyle = shade === 0 ? 'rgba(210,170,80,0.35)' : shade === 1 ? 'rgba(255,210,120,0.25)' : 'rgba(180,140,60,0.2)';
    ctx.beginPath();
    ctx.arc(sx, sy, 1 + (i % 3) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Subtle sand dune highlights
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.ellipse(W * 0.25, H * 0.72, W * 0.2, 8, -0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(W * 0.7, H * 0.8, W * 0.15, 6, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Palm trees
  palmTrees.forEach(pt => {
    const px = W * pt.x;
    const py = H * 0.55;
    // Trunk
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.quadraticCurveTo(px + 15, py - pt.trunkH * 0.5, px + 10, py - pt.trunkH);
    ctx.stroke();
    // Leaves
    for (let a = 0; a < 5; a++) {
      const angle = -Math.PI * 0.8 + a * (Math.PI * 0.4);
      const leafLen = 50 + Math.sin(time * 0.001 + a) * 5;
      ctx.strokeStyle = '#2E7D32';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(px + 10, py - pt.trunkH);
      ctx.quadraticCurveTo(
        px + 10 + Math.cos(angle) * leafLen * 0.5,
        py - pt.trunkH + Math.sin(angle) * leafLen * 0.3,
        px + 10 + Math.cos(angle) * leafLen,
        py - pt.trunkH + Math.sin(angle) * leafLen
      );
      ctx.stroke();
    }
  });

  // Aquarium building (large, enterable)
  const aqW = 260, aqH = 160;
  const aqX = W * 0.33 - aqW * 0.1;
  const aqY = H * 0.55 - aqH;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.roundRect(aqX + 6, aqY + 6, aqW, aqH, 4);
  ctx.fill();

  // Main building body
  const bodyGrad = ctx.createLinearGradient(aqX, aqY, aqX, aqY + aqH);
  bodyGrad.addColorStop(0, '#E8EFF5');
  bodyGrad.addColorStop(1, '#CFD8DC');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.roundRect(aqX, aqY, aqW, aqH, [0, 0, 6, 6]);
  ctx.fill();
  ctx.strokeStyle = '#90A4AE';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Roof
  ctx.fillStyle = '#1565C0';
  ctx.beginPath();
  ctx.moveTo(aqX - 15, aqY);
  ctx.lineTo(aqX + aqW / 2, aqY - 48);
  ctx.lineTo(aqX + aqW + 15, aqY);
  ctx.closePath();
  ctx.fill();
  // Roof trim
  ctx.strokeStyle = '#0D47A1';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Roof highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.moveTo(aqX + aqW * 0.2, aqY);
  ctx.lineTo(aqX + aqW / 2, aqY - 40);
  ctx.lineTo(aqX + aqW * 0.5, aqY);
  ctx.closePath();
  ctx.fill();

  // Sign banner
  ctx.fillStyle = '#0D47A1';
  ctx.beginPath();
  ctx.roundRect(aqX + 30, aqY + 10, aqW - 60, 30, 4);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🐠 AQUARIUM ADVENTURE 🐠', aqX + aqW / 2, aqY + 30);

  // Door (arched)
  const doorW = 48, doorH = 70;
  const doorX = aqX + aqW / 2 - doorW / 2;
  const doorY2 = aqY + aqH - doorH;
  ctx.fillStyle = '#0D47A1';
  ctx.beginPath();
  ctx.moveTo(doorX, doorY2 + doorH);
  ctx.lineTo(doorX, doorY2 + 15);
  ctx.arc(doorX + doorW / 2, doorY2 + 15, doorW / 2, Math.PI, 0);
  ctx.lineTo(doorX + doorW, doorY2 + doorH);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4FC3F7';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Door handle
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(doorX + doorW * 0.75, doorY2 + doorH * 0.55, 4, 0, Math.PI * 2);
  ctx.fill();

  // Windows (with blue glow, fish inside)
  const winW = 50, winH = 40;
  const winY = aqY + 50;
  [aqX + 18, aqX + aqW - 18 - winW].forEach((wx) => {
    // Window glow
    ctx.fillStyle = 'rgba(129,212,250,0.3)';
    ctx.beginPath();
    ctx.roundRect(wx - 3, winY - 3, winW + 6, winH + 6, 5);
    ctx.fill();
    // Window
    const wg = ctx.createLinearGradient(wx, winY, wx, winY + winH);
    wg.addColorStop(0, '#81D4FA');
    wg.addColorStop(1, '#4FC3F7');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.roundRect(wx, winY, winW, winH, 3);
    ctx.fill();
    ctx.strokeStyle = '#B0BEC5';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Window cross frame
    ctx.strokeStyle = '#90A4AE';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(wx + winW / 2, winY);
    ctx.lineTo(wx + winW / 2, winY + winH);
    ctx.moveTo(wx, winY + winH / 2);
    ctx.lineTo(wx + winW, winY + winH / 2);
    ctx.stroke();
  });
  // Fish emoji in windows
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000';
  ctx.fillText('🐟', aqX + 18 + 25, winY + 25);
  ctx.fillText('🐡', aqX + aqW - 18 - 25, winY + 25);

  // Door proximity check
  const doorCX = aqX + aqW / 2;
  const doorCY = H * 0.55;
  const distToDoor = Math.hypot(player.x - doorCX, player.y - doorCY);
  if (distToDoor < 80) {
    ctx.beginPath();
    ctx.arc(doorCX, doorCY, 50, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(79,195,247,0.15)';
    ctx.fill();
    document.getElementById('enter-aquarium-prompt').style.display = 'block';
  } else {
    document.getElementById('enter-aquarium-prompt').style.display = 'none';
  }

  // Water proximity check (dive prompt when near the ocean, but not if aquarium prompt is showing)
  const waterEdgeY = H * 0.52;
  if (player.y < waterEdgeY && distToDoor >= 80) {
    document.getElementById('dive-prompt').style.display = 'block';
  } else {
    document.getElementById('dive-prompt').style.display = 'none';
  }

  // Ticket booth
  drawTicketBooth(time);

  // Beach visitors (queue at booth, walk to door)
  updateBeachVisitors();
  beachVisitors.forEach(v => { if (!v.gone) drawBeachVisitor(v, time); });
  drawBeachFloatingTexts();
}

function drawTicketBooth(time) {
  const bx = W * 0.72;
  const by = H * 0.55;
  const bw = 58, bh = 68;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(bx - bw/2 + 6, by - bh + 6, bw, bh);

  // Body
  ctx.fillStyle = '#8D6E63';
  ctx.fillRect(bx - bw/2, by - bh, bw, bh);

  // Striped roof
  const roofY = by - bh - 8;
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(bx - bw/2 - 8, roofY, bw + 16, 12);
  ctx.fillStyle = '#E53935';
  for (let s = 0; s < 4; s++) {
    ctx.fillRect(bx - bw/2 - 8 + s * 18, roofY, 9, 12);
  }

  // Window
  ctx.fillStyle = '#E3F2FD';
  ctx.fillRect(bx - 17, by - bh + 10, 34, 26);
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 17, by - bh + 10, 34, 26);

  // White person (just white shapes, no detail)
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(bx, by - bh + 22, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(bx - 8, by - bh + 28, 16, 6);

  // Counter ledge
  ctx.fillStyle = '#4E342E';
  ctx.fillRect(bx - bw/2, by - bh + 36, bw, 6);

  // TICKETS sign
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TICKETS', bx, roofY - 4);

  // Visitor counter (below booth)
  ctx.fillStyle = '#263238';
  ctx.beginPath();
  ctx.roundRect(bx - 28, by + 4, 56, 22, 6);
  ctx.fill();
  ctx.strokeStyle = '#4FC3F7';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(bx - 28, by + 4, 56, 22, 6);
  ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`👤 ${totalVisitorCount}`, bx, by + 19);

  // Dashed arrow pointing toward aquarium
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.moveTo(bx - bw/2 - 5, by - bh/2);
  ctx.lineTo(bx - bw/2 - 45, by - bh/2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.moveTo(bx - bw/2 - 52, by - bh/2);
  ctx.lineTo(bx - bw/2 - 38, by - bh/2 - 6);
  ctx.lineTo(bx - bw/2 - 38, by - bh/2 + 6);
  ctx.closePath();
  ctx.fill();
}

// ============ PLAYER DRAWING ============
function drawPlayer(time) {
  const scale = player.size / 60;
  // In ocean, convert world coords to screen coords
  const drawX = player.x;
  const drawY = STATE.scene === 'ocean' ? player.y - cameraY : player.y;
  // draw the full creator character at game scale
  drawCreatorCharacter(drawX, drawY, scale, time);
  if (STATE.scene === 'ocean') {
    const s = 60 * scale;
    const bob = Math.sin(time * 0.003) * 3 * scale;
    const px = drawX, py = drawY;
    const bp = BODY_PROPS[player.bodyType] || BODY_PROPS.athletic;
    const lm = bp[2], hipW = bp[1];
    const bootY = py + s*0.22 + s*0.75*lm + bob;
    // Scuba mask over face
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(px, py - s*0.52 + bob, s*0.19, s*0.14, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(129,212,250,0.35)';
    ctx.fill();
    // Flippers
    ctx.fillStyle = '#1565C0';
    ctx.beginPath();
    ctx.ellipse(px - s*hipW*0.42, bootY + s*0.1, s*0.2, s*0.08, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(px + s*hipW*0.42, bootY + s*0.1, s*0.2, s*0.08, 0.2, 0, Math.PI*2);
    ctx.fill();
  }
}

// ============ OCEAN SCENE ============
function drawOcean(time) {
  // Camera follows player (player.y is in world coords)
  cameraY = player.y - H * 0.4;
  cameraY = Math.max(0, Math.min(cameraY, OCEAN_DEPTH - H));

  // Background: water gradient that shifts with depth
  // Blend colors based on camera position
  const depthRatio = cameraY / (OCEAN_DEPTH - H);
  // Top = bright turquoise, bottom = near black
  const bgColors = [
    lerpColor('#00C8D8', '#0A0A1A', depthRatio),
    lerpColor('#0097A7', '#050510', depthRatio),
    lerpColor('#006064', '#000008', depthRatio),
  ];
  const waterGrad = ctx.createLinearGradient(0, 0, 0, H);
  waterGrad.addColorStop(0, bgColors[0]);
  waterGrad.addColorStop(0.5, bgColors[1]);
  waterGrad.addColorStop(1, bgColors[2]);
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, 0, W, H);

  // Light rays (fade out with depth)
  const lightAlpha = Math.max(0, 0.04 * (1 - depthRatio * 1.3));
  if (lightAlpha > 0.005) {
    ctx.save();
    for (let i = 0; i < 5; i++) {
      const rx = W * 0.1 + i * W * 0.2;
      const sway = Math.sin(time * 0.0008 + i) * 30;
      ctx.beginPath();
      ctx.moveTo(rx + sway, 0);
      ctx.lineTo(rx + sway - 40, H);
      ctx.lineTo(rx + sway + 40, H);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,255,255,${lightAlpha})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // Zone transition lines (faint horizontal dividers)
  ZONE_BANDS.forEach(band => {
    const screenY = band.endY - cameraY;
    if (screenY > -20 && screenY < H + 20 && band.endY < OCEAN_DEPTH) {
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 12]);
      ctx.beginPath();
      ctx.moveTo(0, screenY);
      ctx.lineTo(W, screenY);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Bubbles (in screen coords)
  if (Math.random() < 0.1) {
    bubbles.push({
      x: player.x + (Math.random() - 0.5) * 20,
      y: player.y - cameraY - 10,
      size: 2 + Math.random() * 4,
      speed: 1 + Math.random(),
    });
  }
  bubbles = bubbles.filter(b => b.y > -10);
  bubbles.forEach(b => {
    b.y -= b.speed;
    b.x += Math.sin(b.y * 0.05) * 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.stroke();
  });

  // Seabed at the very bottom of the world
  const seabedScreenY = OCEAN_DEPTH - 40 - cameraY;
  if (seabedScreenY < H + 20) {
    ctx.fillStyle = '#3E2723';
    ctx.beginPath();
    ctx.moveTo(0, seabedScreenY);
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, seabedScreenY + Math.sin(x * 0.05) * 10);
    }
    ctx.lineTo(W, H + 20);
    ctx.lineTo(0, H + 20);
    ctx.closePath();
    ctx.fill();
  }

  // Draw decorations (world coords -> screen coords)
  oceanDecos.forEach(d => {
    if (d.collected) return;
    const screenY = d.y - cameraY;
    if (screenY > -50 && screenY < H + 50) {
      drawDecoration({ ...d, y: screenY }, time);
    }
  });

  // Move and draw fish (world coords)
  oceanFish.forEach(f => {
    if (!f.alive) return;
    f.x += f.dx;
    f.y += f.dy + Math.sin(time * 0.003 + f.phase) * 0.3;
    // Bounce horizontally (wrap)
    if (f.x < -50) f.x = W + 50;
    if (f.x > W + 50) f.x = -50;
    // Bounce vertically within their zone band
    if (f.y < f.minY) { f.y = f.minY; f.dy = Math.abs(f.dy); }
    if (f.y > f.maxY) { f.y = f.maxY; f.dy = -Math.abs(f.dy); }

    // Only draw if on screen
    const screenY = f.y - cameraY;
    if (screenY > -60 && screenY < H + 60) {
      drawFish({ ...f, y: screenY }, time);
    }
  });

  // Move and draw bosses
  bosses.forEach(b => {
    if (!b.alive) return;
    b.x += b.dx;
    b.y += b.dy + Math.sin(time * 0.002 + b.phase) * 0.3;
    if (b.x < 60) { b.x = 60; b.dx = Math.abs(b.dx); }
    if (b.x > W - 60) { b.x = W - 60; b.dx = -Math.abs(b.dx); }
    if (b.y < b.minY) { b.y = b.minY; b.dy = Math.abs(b.dy); }
    if (b.y > b.maxY) { b.y = b.maxY; b.dy = -Math.abs(b.dy); }

    const screenY = b.y - cameraY;
    if (screenY > -120 && screenY < H + 120) {
      drawBoss(b, time, screenY);

      // Check proximity: auto-trigger boss fight
      if (!bossEncounterActive) {
        const playerScreenY = player.y - cameraY;
        const dist = Math.hypot(player.x - b.x, playerScreenY - screenY);
        if (dist < b.size + 30) {
          // Screen goes red!
          bossWarningAlpha = 0.6;
          startBossFight(b);
        } else if (dist < b.size + 120) {
          // Warning: screen tints red as you get close
          const closeness = 1 - (dist - b.size - 30) / 90;
          bossWarningAlpha = Math.max(bossWarningAlpha, closeness * 0.35);
        }
      }
    }
  });

  // Red screen warning overlay
  if (bossWarningAlpha > 0.01) {
    ctx.fillStyle = `rgba(180,0,0,${bossWarningAlpha})`;
    ctx.fillRect(0, 0, W, H);
    bossWarningAlpha *= 0.96; // fade out
  }

  // Move and draw mermaids
  nearMermaid = null;
  mermaids.forEach(m => {
    m.x += m.dx;
    m.y += Math.sin(performance.now() * 0.001 + m.phase) * 0.3;
    // Keep in coral zone bounds
    if (m.x < 40) { m.x = 40; m.dx = Math.abs(m.dx); }
    if (m.x > W - 40) { m.x = W - 40; m.dx = -Math.abs(m.dx); }
    if (m.y < 80) m.y = 80;
    if (m.y > 550) m.y = 550;

    const screenY = m.y - cameraY;
    if (screenY > -80 && screenY < H + 80) {
      drawMermaid(m, time, screenY);

      // Check proximity to player (in screen coords)
      const playerScreenY = player.y - cameraY;
      const dist = Math.hypot(player.x - m.x, playerScreenY - screenY);
      if (dist < 80) {
        nearMermaid = m;
      }
    }
  });

  // Show/hide mermaid talk prompt
  if (nearMermaid && !shopOpen) {
    document.getElementById('mermaid-prompt').style.display = 'block';
  } else {
    document.getElementById('mermaid-prompt').style.display = 'none';
  }

  // Update zone label based on player depth
  const currentZone = getZoneAtDepth(player.y);
  if (currentZone.zone !== STATE.zone) {
    STATE.zone = currentZone.zone;
    document.getElementById('zone-label').textContent = currentZone.label;
  }

  // Depth indicator
  const depthMeters = Math.floor(player.y / 10);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(W - 90, 55, 80, 28, 8);
  ctx.fill();
  ctx.fillStyle = '#81D4FA';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${depthMeters}m deep`, W - 50, 74);
}

// Color lerp helper
function lerpColor(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const ah = parseInt(a.slice(1), 16);
  const bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab2 = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const b2 = Math.round(ab2 + (bb - ab2) * t);
  return `rgb(${r},${g},${b2})`;
}

function drawFish(f, time) {
  const x = f.x;
  const y = f.y;
  const s = f.size;
  const dir = f.dx >= 0 ? 1 : -1;

  ctx.save();
  ctx.translate(x, y);

  // Dispatch to specialized drawing based on shape
  if (f.shape === 'jellyfish') {
    drawJellyfishCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'squid') {
    ctx.scale(dir, 1);
    drawSquidCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'ghost') {
    drawGhostCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'star') {
    drawStarCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'chest') {
    ctx.scale(dir, 1);
    drawChestCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'alien') {
    drawAlienCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'cluster') {
    drawClusterCreature(ctx, s, f.colors, time, f.phase);
  } else if (f.shape === 'puffer') {
    drawPufferCreature(ctx, s, f.colors, time, f.phase);
  } else {
    // Default fish shape
    ctx.scale(dir, 1);
    drawDefaultFish(ctx, s, f.colors, time, f.phase, f.zone);
  }

  ctx.restore();
}

// ============ DEFAULT FISH ============
function drawDefaultFish(ctx, s, colors, time, phase, zone) {
  // Tail
  ctx.fillStyle = colors[2] || colors[0];
  ctx.beginPath();
  ctx.moveTo(-s * 0.5, 0);
  const tailWag = Math.sin(time * 0.01 + phase) * 5;
  ctx.lineTo(-s * 0.8, -s * 0.3 + tailWag);
  ctx.lineTo(-s * 0.8, s * 0.3 + tailWag);
  ctx.closePath();
  ctx.fill();

  // Body
  const bodyGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.5);
  bodyGrad.addColorStop(0, colors[0]);
  bodyGrad.addColorStop(0.6, colors[1] || colors[0]);
  bodyGrad.addColorStop(1, colors[0]);
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.5, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Stripe
  if (colors.length >= 2) {
    ctx.fillStyle = colors[1];
    ctx.beginPath();
    ctx.ellipse(s * 0.05, 0, s * 0.1, s * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Fin on top
  ctx.fillStyle = colors[2] || colors[0];
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.25);
  ctx.lineTo(s * 0.05, -s * 0.5);
  ctx.lineTo(s * 0.2, -s * 0.2);
  ctx.closePath();
  ctx.fill();

  // Eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(s * 0.25, -s * 0.05, s * 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(s * 0.28, -s * 0.05, s * 0.05, 0, Math.PI * 2);
  ctx.fill();

  // Glow for deep-sea fish
  if (zone === 'deep') {
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.7, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(206,147,216,0.1)';
    ctx.fill();
  }
}

// ============ JELLYFISH ============
function drawJellyfishCreature(ctx, s, colors, time, phase) {
  const bob = Math.sin(time * 0.003 + phase) * 3;
  const pulse = 1 + Math.sin(time * 0.005 + phase) * 0.08;

  // Glow
  ctx.fillStyle = colors[2] || 'rgba(255,255,255,0.05)';
  ctx.globalAlpha = 0.15;
  ctx.beginPath();
  ctx.arc(0, bob, s * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Dome
  ctx.fillStyle = colors[0];
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(0, -s * 0.1 + bob, s * 0.35 * pulse, Math.PI, 0);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Inner dome highlight
  ctx.fillStyle = colors[1] || colors[0];
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(0, -s * 0.12 + bob, s * 0.22 * pulse, Math.PI, 0);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Tentacles
  ctx.strokeStyle = colors[0];
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.6;
  for (let i = 0; i < 5; i++) {
    const tx = -s * 0.2 + i * s * 0.1;
    const wave = Math.sin(time * 0.004 + phase + i * 0.8) * 6;
    ctx.beginPath();
    ctx.moveTo(tx, -s * 0.1 + bob);
    ctx.quadraticCurveTo(tx + wave, s * 0.15 + bob, tx + wave * 0.5, s * 0.4 + bob);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-s * 0.08, -s * 0.15 + bob, s * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.08, -s * 0.15 + bob, s * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath(); ctx.arc(-s * 0.06, -s * 0.15 + bob, s * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.1, -s * 0.15 + bob, s * 0.03, 0, Math.PI * 2); ctx.fill();
}

// ============ SQUID ============
function drawSquidCreature(ctx, s, colors, time, phase) {
  const wave = Math.sin(time * 0.005 + phase) * 3;

  // Tentacles
  ctx.strokeStyle = colors[1] || colors[0];
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const tx = -s * 0.12 + i * s * 0.05;
    const tw = Math.sin(time * 0.004 + phase + i * 0.7) * 5;
    ctx.beginPath();
    ctx.moveTo(tx, s * 0.2);
    ctx.quadraticCurveTo(tx + tw, s * 0.35, tx + tw * 1.2, s * 0.5);
    ctx.stroke();
  }

  // Body (elongated oval)
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.05 + wave, s * 0.2, s * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // Mantle point
  ctx.beginPath();
  ctx.moveTo(-s * 0.12, -s * 0.35 + wave);
  ctx.lineTo(0, -s * 0.5 + wave);
  ctx.lineTo(s * 0.12, -s * 0.35 + wave);
  ctx.fillStyle = colors[0];
  ctx.fill();

  // Side fins
  ctx.fillStyle = colors[2] || colors[0];
  ctx.beginPath();
  ctx.ellipse(-s * 0.22, -s * 0.15 + wave, s * 0.1, s * 0.06, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.22, -s * 0.15 + wave, s * 0.1, s * 0.06, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-s * 0.07, -s * 0.05 + wave, s * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.07, -s * 0.05 + wave, s * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath(); ctx.arc(-s * 0.05, -s * 0.05 + wave, s * 0.035, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.09, -s * 0.05 + wave, s * 0.035, 0, Math.PI * 2); ctx.fill();
}

// ============ GHOST (Ghosty) ============
function drawGhostCreature(ctx, s, colors, time, phase) {
  const bob = Math.sin(time * 0.003 + phase) * 4;
  const wobble = Math.sin(time * 0.005 + phase) * 2;

  // Ghostly glow
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.arc(0, bob, s * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // Body (round top, wavy bottom)
  ctx.fillStyle = colors[0];
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(0, -s * 0.1 + bob, s * 0.3, Math.PI, 0);
  // Wavy bottom edge
  ctx.lineTo(s * 0.3, s * 0.1 + bob);
  for (let i = 0; i < 4; i++) {
    const px = s * 0.3 - (i + 1) * (s * 0.6 / 4);
    const py = s * 0.1 + bob + (i % 2 === 0 ? s * 0.15 : 0) + Math.sin(time * 0.004 + i) * 3;
    ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Big round eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.12 + bob, s * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.1, -s * 0.12 + bob, s * 0.1, 0, Math.PI * 2); ctx.fill();
  // Pupils (look slightly different directions)
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(-s * 0.08 + wobble, -s * 0.12 + bob, s * 0.05, 0, Math.PI * 2); ctx.fill();
