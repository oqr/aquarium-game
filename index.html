function startBossRound() {
  if (!bossFightTarget) return;
  bossRound++;
  selectedTarget = bossFightTarget;

  const mgCanvas = document.getElementById('minigame-canvas');
  const dpr = window.devicePixelRatio || 1;
  mgCanvas.width = 350 * dpr;
  mgCanvas.height = 350 * dpr;
  mgCanvas.style.width = '350px';
  mgCanvas.style.height = '350px';
  const mgCtx = mgCanvas.getContext('2d');
  mgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Scale fight by bossDifficulty (1=easy, 2=medium, 3=hard)
  const bd = bossFightTarget.bossDifficulty || 2;
  const tridentSlow = getTridentSlowFactor();
  const ballSpeed = (2.0 + bd * 0.5 + bossRound * 0.3) * tridentSlow;
  const netWidth = Math.max(30, 40 - bd * 4);
  const catchesNeeded = 1 + bd + Math.floor(bossRound * 0.5);
  const totalTime = 6000 - bd * 400 - bossRound * 200;

  minigameState = {
    canvas: mgCanvas,
    ctx: mgCtx,
    target: bossFightTarget,
    ballX: 175,
    ballSpeed: ballSpeed,
    ballDir: 1,
    ballSize: 14,
    netX: 175,
    netWidth: netWidth,
    netY: 270,
    catchesLeft: catchesNeeded,
    catchesNeeded: catchesNeeded,
    totalTime: totalTime,
    startTime: null,
    active: false,
    waiting: true,
    swingAnim: 0,
    lastHit: false,
    missAnim: 0,
    isBossRound: true,
    bossRoundNum: bossRound,
  };

  document.getElementById('catch-minigame').style.display = 'flex';
  drawMinigame(performance.now());

  setTimeout(() => {
    if (minigameState) {
      minigameState.waiting = false;
      minigameState.active = true;
      minigameState.startTime = performance.now();
    }
  }, 700);
}

function bossRoundWon() {
  if (bossRound < 3) {
    showResult(`Round ${bossRound}/3 complete! Get ready...`, 1200);
    setTimeout(() => {
      startBossRound();
    }, 1300);
  } else {
    // All 3 rounds beaten! Catch the boss
    bossFightTarget.alive = false;
    if (STATE.inventory.fish.length < STATE.maxFish) {
      STATE.inventory.fish.push({ ...bossFightTarget });
      updateInventory();
      showResult(`BOSS CAUGHT! ${bossFightTarget.name} goes to the Monster Tank!`, 3000);
    } else {
      const money = bossFightTarget.value;
      STATE.money += money;
      updateMoney();
      showResult(`Inventory full! Defeated for $${money}!`, 2500);
    }
    endBossFight();
  }
}

function bossRoundLost() {
  // Player dies! Lose all inventory fish, return to aquarium immediately
  const bossName = bossFightTarget ? bossFightTarget.name : 'Boss';

  // Clear ALL boss and ocean state before switching scene
  bossEncounterActive = false;
  bossFightTarget = null;
  bossRound = 0;
  bossWarningAlpha = 0;
  selectedTarget = null;
  minigameState = null;
  if (STATE.scubaTimer) clearInterval(STATE.scubaTimer);
  STATE.scubaTimer = null;

  // Hide all ocean/catch UI
  document.getElementById('catch-minigame').style.display = 'none';
  document.getElementById('catch-menu').style.display = 'none';
  document.getElementById('scuba-timer').style.display = 'none';
  document.getElementById('scuba-timer').style.color = '#4FC3F7';
  document.getElementById('zone-label').style.display = 'none';
  document.getElementById('surface-btn').style.display = 'none';
  document.getElementById('mermaid-prompt').style.display = 'none';
  document.getElementById('dive-prompt').style.display = 'none';
  document.getElementById('enter-aquarium-prompt').style.display = 'none';
  document.getElementById('inventory-panel').style.display = 'none';

  // Clear inventory and switch to aquarium
  STATE.inventory.fish = [];
  updateInventory();
  STATE.scene = 'aquarium';
  initTankFish();
  floatingTexts = [];

  // Place player on the aquarium floor
  const floorY = H * AQUARIUM_FLOOR_Y;
  player.x = 120;
  player.y = floorY;
  player.targetX = player.x;
  player.targetY = floorY;
  aquariumCameraX = 0;
  document.getElementById('exit-aquarium-btn').style.display = 'block';

  showResult(`${bossName} defeated you! Lost all inventory fish!`, 3000);
}

function endBossFight() {
  bossEncounterActive = false;
  bossFightTarget = null;
  bossRound = 0;
  selectedTarget = null;
  bossWarningAlpha = 0;
  // Resume scuba timer
  if (STATE.scene === 'ocean') {
    STATE.scubaTimer = setInterval(() => {
      STATE.scubaTime--;
      document.getElementById('scuba-timer').textContent = `🫧 Air: ${STATE.scubaTime}s`;
      if (STATE.scubaTime <= 10) {
        document.getElementById('scuba-timer').style.color = '#EF5350';
      }
      if (STATE.scubaTime <= 0) {
        surface();
      }
    }, 1000);
  }
}

// ============ MERMAID SHOP ============
let shopOpen = false;
STATE.ownedItems = []; // track purchased item IDs
STATE.tridentLevel = 0; // 0 = not owned, 1-3 = upgrade tier
STATE.netLevel = 0;     // 0 = not owned, 1-3 = upgrade tier

function openMermaidShop() {
  shopOpen = true;
  document.getElementById('mermaid-prompt').style.display = 'none';
  document.getElementById('shop-overlay').style.display = 'block';
  document.getElementById('shop-money-display').textContent = `$${STATE.money}`;
  renderShopItems();
  // Pause scuba timer while in shop
  if (STATE.scubaTimer) clearInterval(STATE.scubaTimer);
}

function closeMermaidShop() {
  shopOpen = false;
  document.getElementById('shop-overlay').style.display = 'none';
  // Resume scuba timer
  if (STATE.scene === 'ocean') {
    STATE.scubaTimer = setInterval(() => {
      STATE.scubaTime--;
      document.getElementById('scuba-timer').textContent = `🫧 Air: ${STATE.scubaTime}s`;
      if (STATE.scubaTime <= 10) {
        document.getElementById('scuba-timer').style.color = '#EF5350';
      }
      if (STATE.scubaTime <= 0) {
        surface();
      }
    }, 1000);
  }
}

function renderShopItems() {
  const container = document.getElementById('shop-items-list');
  container.innerHTML = '';
  SHOP_ITEMS.forEach(item => {
    if (item.type === 'upgradeable') {
      renderUpgradeableItem(container, item);
      return;
    }
    const owned = STATE.ownedItems.includes(item.id);
    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '');
    div.innerHTML = `
      <div class="item-icon">${item.icon}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
      </div>
      <div class="item-price ${owned ? 'bought' : ''}">${owned ? 'OWNED' : '$' + item.price.toLocaleString()}</div>
    `;
    if (!owned) {
      div.onclick = () => buyItem(item);
    }
    container.appendChild(div);
  });
}

function getUpgradeInfo(id) {
  if (id === 'net') return { upgrades: NET_UPGRADES, level: STATE.netLevel, icon: '🥅' };
  if (id === 'trident') return { upgrades: TRIDENT_UPGRADES, level: STATE.tridentLevel, icon: '🔱' };
  return null;
}

function renderUpgradeableItem(container, item) {
  const info = getUpgradeInfo(item.id);
  if (!info) return;
  const { upgrades, level, icon } = info;
  const maxed = level >= upgrades.length;
  const next = maxed ? null : upgrades[level];
  const div = document.createElement('div');
  div.className = 'shop-item' + (maxed ? ' owned' : '');

  if (level === 0) {
    div.innerHTML = `
      <div class="item-icon">${icon}</div>
      <div class="item-info">
        <div class="item-name">${next.name}</div>
        <div class="item-desc">${next.desc}</div>
      </div>
      <div class="item-price">$${next.price.toLocaleString()}</div>
    `;
    div.onclick = () => buyUpgradeable(item.id);
  } else if (maxed) {
    const top = upgrades[upgrades.length - 1];
    div.innerHTML = `
      <div class="item-icon">${icon}</div>
      <div class="item-info">
        <div class="item-name">${top.name}</div>
        <div class="item-desc">${top.desc} (fully upgraded)</div>
      </div>
      <div class="item-price bought">MAX</div>
    `;
  } else {
    const prev = upgrades[level - 1];
    div.innerHTML = `
      <div class="item-icon">${icon}</div>
      <div class="item-info">
        <div class="item-name">${prev.name} → ${next.name}</div>
        <div class="item-desc">Upgrade: ${next.desc}</div>
      </div>
      <div class="item-price">$${next.price.toLocaleString()}</div>
    `;
    div.onclick = () => buyUpgradeable(item.id);
  }
  container.appendChild(div);
}

function buyUpgradeable(id) {
  const info = getUpgradeInfo(id);
  if (!info) return;
  const { upgrades, level, icon } = info;
  if (level >= upgrades.length) return;
  const upgrade = upgrades[level];
  if (STATE.money < upgrade.price) {
    showResult("Not enough money!", 1500);
    return;
  }
  STATE.money -= upgrade.price;
  if (id === 'net') STATE.netLevel = upgrade.level;
  if (id === 'trident') STATE.tridentLevel = upgrade.level;
  if (level === 0) STATE.ownedItems.push(id);
  updateMoney();
  document.getElementById('shop-money-display').textContent = `$${STATE.money}`;
  showResult(`${icon} ${upgrade.name}! ${upgrade.desc}`, 2000);
  renderShopItems();
}

function getNetBonus() {
  if (STATE.netLevel <= 0) return { diffReduce: 0, dotBonus: 0, timeBonus: 0 };
  return NET_UPGRADES[STATE.netLevel - 1];
}

function getTridentSlowFactor() {
  if (STATE.tridentLevel <= 0) return 1;
  return TRIDENT_UPGRADES[STATE.tridentLevel - 1].slowFactor;
}

function buyItem(item) {
  if (STATE.money < item.price) {
    showResult("Not enough money!", 1500);
    return;
  }
  if (item.type === 'upgradeable') { buyUpgradeable(item.id); return; }
  if (STATE.ownedItems.includes(item.id)) return;

  STATE.money -= item.price;
  STATE.ownedItems.push(item.id);
  updateMoney();
  document.getElementById('shop-money-display').textContent = `$${STATE.money}`;

  // Apply item effects
  if (item.id === 'potion') {
    STATE.maxScubaTime = 120;
    STATE.scubaTime = Math.min(STATE.scubaTime + 60, 120);
    showResult("🧪 Air time doubled! 120 seconds!", 2000);
  } else if (item.id === 'jellyball') {
    showResult("🔮 Jelly Ball acquired! Glowing power!", 2000);
  } else if (item.id === 'teleport') {
    showResult("✨ Teleport enabled! Fast travel unlocked!", 2000);
  } else {
    // Decoration items go to inventory
    STATE.inventory.decorations.push({ name: item.name, color: '#CE93D8', shape: 'coral' });
    updateInventory();
    showResult(`Got ${item.icon} ${item.name}!`, 1500);
  }

  renderShopItems();
}

// ============ INPUT ============
function handleClick(e) {
  e.preventDefault();
  const cx = e.clientX || e.touches?.[0]?.clientX;
  const cy = e.clientY || e.touches?.[0]?.clientY;

  // Title screen
  if (STATE.scene === 'title') {
    STATE.scene = 'creator';
    return;
  }

  // Character creator
  if (STATE.scene === 'creator') {
    for (const btn of creatorButtons) {
      if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
        btn.fn();
        return;
      }
    }
    return;
  }

  // Aquarium interior
  if (STATE.scene === 'aquarium') {
    handleAquariumClick(cx, cy);
    return;
  }

  if (STATE.scene === 'ocean') {
    // Check if tapped on a mermaid
    for (let m of mermaids) {
      const mScreenY = m.y - cameraY;
      const dist = Math.hypot(cx - m.x, cy - mScreenY);
      if (dist < 50) {
        openMermaidShop();
        return;
      }
    }

    // Check if tapped on a fish (compare in screen coords)
    for (let f of oceanFish) {
      if (!f.alive) continue;
      const fScreenY = f.y - cameraY;
      const dist = Math.hypot(cx - f.x, cy - fScreenY);
      if (dist < f.size + 10) {
        openCatchMenu(f);
        return;
      }
    }

    // Check if tapped on a decoration (compare in screen coords)
    for (let d of oceanDecos) {
      if (d.collected) continue;
      const dScreenY = d.y - cameraY;
      const dist = Math.hypot(cx - d.x, cy - dScreenY);
      if (dist < 25) {
        if (STATE.inventory.decorations.length < STATE.maxDeco) {
          STATE.inventory.decorations.push({ name: d.name, color: d.color, shape: d.shape });
          d.collected = true;
          updateInventory();
          showResult(`Found ${d.name}!`, 1200);
        } else {
          showResult("Decorations inventory full!", 1500);
        }
        return;
      }
    }

    // Move player (convert screen tap to world coords)
    player.targetX = cx;
    player.targetY = Math.max(10, Math.min(cy + cameraY, OCEAN_DEPTH - 30));
  } else {
    // Beach: move player
    player.targetX = cx;
    player.targetY = Math.max(H * 0.4, cy); // Don't go above ocean
  }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', handleClick, { passive: false });

const mgCanvas = document.getElementById('minigame-canvas');
mgCanvas.addEventListener('click', handleMinigameClick);
mgCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleMinigameClick(e); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (STATE.scene === 'title') {
      STATE.scene = 'creator';
    } else if (minigameState && minigameState.active) {
      swingNet();
    }
  }
});

// ============ GAME LOOP ============
function update() {
  const dx = player.targetX - player.x;
  const dy = player.targetY - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 2) {
    player.x += (dx / dist) * player.speed;
    player.y += (dy / dist) * player.speed;
  }
  // Clamp player in ocean world bounds
  if (STATE.scene === 'ocean') {
    player.x = Math.max(20, Math.min(player.x, W - 20));
    player.y = Math.max(10, Math.min(player.y, OCEAN_DEPTH - 30));
  }
  // Clamp player in aquarium hallway
  if (STATE.scene === 'aquarium') {
    player.x = Math.max(30, Math.min(player.x, AQUARIUM_HALLWAY_W - 30));
    player.y = H * AQUARIUM_FLOOR_Y; // always on floor
  }
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);

  if (STATE.scene === 'title') {
    drawTitle(time);
    return;
  }

  if (STATE.scene === 'creator') {
    drawCreator(time);
    return;
  }

  if (STATE.scene === 'beach') {
    drawBeach(time);
  } else if (STATE.scene === 'ocean') {
    drawOcean(time);
  } else if (STATE.scene === 'aquarium') {
    drawAquariumInterior(time);
    return; // player is drawn inside drawAquariumInterior
  }

  drawPlayer(time);

}

// Init
updateInventory();

// Hide game UI until creator is done
document.getElementById('hud').style.display = 'none';
document.getElementById('inventory-btn').style.display = 'none';

function gameLoop(time) {
  update();
  draw(time);
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
