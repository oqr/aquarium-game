  ctx.beginPath(); ctx.arc(s * 0.12 + wobble, -s * 0.12 + bob, s * 0.05, 0, Math.PI * 2); ctx.fill();

  // Small open mouth
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(0, s * 0.0 + bob, s * 0.05, 0, Math.PI * 2);
  ctx.fill();
}

// ============ STAR CREATURE ============
function drawStarCreature(ctx, s, colors, time, phase) {
  const spin = time * 0.001 + phase;
  const pulse = 1 + Math.sin(time * 0.004 + phase) * 0.05;

  ctx.fillStyle = colors[0];
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * Math.PI * 2) / 5 + spin * 0.3;
    const a2 = a + Math.PI / 5;
    const outerR = s * 0.45 * pulse;
    const innerR = s * 0.18 * pulse;
    if (i === 0) ctx.moveTo(Math.cos(a) * outerR, Math.sin(a) * outerR);
    else ctx.lineTo(Math.cos(a) * outerR, Math.sin(a) * outerR);
    ctx.lineTo(Math.cos(a2) * innerR, Math.sin(a2) * innerR);
  }
  ctx.closePath();
  ctx.fill();

  // Inner color
  ctx.fillStyle = colors[1] || colors[0];
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-s * 0.06, -s * 0.03, s * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.06, -s * 0.03, s * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath(); ctx.arc(-s * 0.04, -s * 0.03, s * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.08, -s * 0.03, s * 0.03, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.strokeStyle = colors[2] || '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, s * 0.03, s * 0.06, 0.15, Math.PI - 0.15);
  ctx.stroke();
}

// ============ CHESTIES (walking chest) ============
function drawChestCreature(ctx, s, colors, time, phase) {
  const bounce = Math.abs(Math.sin(time * 0.006 + phase)) * 3;
  const legSwing = Math.sin(time * 0.008 + phase) * 0.3;

  // Legs
  ctx.strokeStyle = colors[1];
  ctx.lineWidth = 3;
  // Left leg
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, s * 0.15 - bounce);
  ctx.lineTo(-s * 0.2, s * 0.35 - bounce + Math.sin(legSwing) * 3);
  ctx.stroke();
  // Right leg
  ctx.beginPath();
  ctx.moveTo(s * 0.15, s * 0.15 - bounce);
  ctx.lineTo(s * 0.2, s * 0.35 - bounce - Math.sin(legSwing) * 3);
  ctx.stroke();

  // Chest body (box)
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.roundRect(-s * 0.3, -s * 0.2 - bounce, s * 0.6, s * 0.38, 3);
  ctx.fill();
  ctx.strokeStyle = colors[1];
  ctx.lineWidth = 2;
  ctx.stroke();

  // Lid (slightly open, hinged at back)
  const lidOpen = Math.sin(time * 0.003 + phase) * 0.15 + 0.1;
  ctx.fillStyle = colors[0];
  ctx.save();
  ctx.translate(-s * 0.3, -s * 0.2 - bounce);
  ctx.rotate(-lidOpen);
  ctx.fillRect(0, -s * 0.12, s * 0.6, s * 0.12);
  ctx.strokeStyle = colors[1];
  ctx.lineWidth = 2;
  ctx.strokeRect(0, -s * 0.12, s * 0.6, s * 0.12);
  ctx.restore();

  // Clasp / lock (gold)
  ctx.fillStyle = colors[2] || '#FFD600';
  ctx.beginPath();
  ctx.arc(0, -s * 0.05 - bounce, s * 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(0, -s * 0.05 - bounce, s * 0.025, 0, Math.PI * 2);
  ctx.fill();

  // Eyes peering from inside
  ctx.fillStyle = '#FFEB3B';
  ctx.beginPath(); ctx.arc(-s * 0.08, -s * 0.22 - bounce, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.08, -s * 0.22 - bounce, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-s * 0.07, -s * 0.22 - bounce, s * 0.02, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.09, -s * 0.22 - bounce, s * 0.02, 0, Math.PI * 2); ctx.fill();
}

// ============ DEEP ALIEN ============
function drawAlienCreature(ctx, s, colors, time, phase) {
  const sway = Math.sin(time * 0.003 + phase) * 3;

  // Antennae
  ctx.strokeStyle = colors[0];
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-s * 0.08, -s * 0.3);
  ctx.quadraticCurveTo(-s * 0.2, -s * 0.55 + sway, -s * 0.15, -s * 0.6 + sway);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s * 0.08, -s * 0.3);
  ctx.quadraticCurveTo(s * 0.2, -s * 0.55 + sway, s * 0.15, -s * 0.6 + sway);
  ctx.stroke();

  // Glowing antenna tips
  const glow = 0.5 + Math.sin(time * 0.008 + phase) * 0.5;
  ctx.fillStyle = colors[2] || '#FFEB3B';
  ctx.globalAlpha = glow;
  ctx.beginPath(); ctx.arc(-s * 0.15, -s * 0.6 + sway, s * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.15, -s * 0.6 + sway, s * 0.05, 0, Math.PI * 2); ctx.fill();
  // Extra glow halo
  ctx.beginPath(); ctx.arc(-s * 0.15, -s * 0.6 + sway, s * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.15, -s * 0.6 + sway, s * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // Body (triangular / alien head)
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.35);
  ctx.lineTo(s * 0.28, s * 0.05);
  ctx.lineTo(-s * 0.28, s * 0.05);
  ctx.closePath();
  ctx.fill();

  // Zigzag legs
  ctx.strokeStyle = colors[1] || colors[0];
  ctx.lineWidth = 1.5;
  for (let side = -1; side <= 1; side += 2) {
    const legWave = Math.sin(time * 0.005 + phase + side) * 3;
    ctx.beginPath();
    ctx.moveTo(side * s * 0.12, s * 0.05);
    ctx.lineTo(side * s * 0.2, s * 0.18 + legWave);
    ctx.lineTo(side * s * 0.12, s * 0.28 + legWave);
    ctx.lineTo(side * s * 0.22, s * 0.4 + legWave);
    ctx.stroke();
  }

  // Big glowing eyes
  ctx.fillStyle = colors[2] || '#FFEB3B';
  ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.1, s * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.1, -s * 0.1, s * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-s * 0.08, -s * 0.1, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.12, -s * 0.1, s * 0.04, 0, Math.PI * 2); ctx.fill();
}

// ============ CLUSTER BALL ============
function drawClusterCreature(ctx, s, colors, time, phase) {
  const pulse = 1 + Math.sin(time * 0.004 + phase) * 0.08;

  // Outer orbiting bubbles
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + time * 0.002 + phase;
    const r = s * 0.25 * pulse;
    const bx = Math.cos(a) * r;
    const by = Math.sin(a) * r;
    ctx.fillStyle = colors[i % 2 === 0 ? 0 : 1] || colors[0];
    ctx.globalAlpha = 0.6 + Math.sin(time * 0.005 + i) * 0.3;
    ctx.beginPath();
    ctx.arc(bx, by, s * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Core
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.18);
  coreGrad.addColorStop(0, colors[2] || colors[0]);
  coreGrad.addColorStop(1, colors[0]);
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
  ctx.fill();

  // Central eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.08, 0, Math.PI * 2);
  ctx.fill();
  const eyeLook = Math.sin(time * 0.002 + phase) * s * 0.02;
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(eyeLook, 0, s * 0.04, 0, Math.PI * 2);
  ctx.fill();
}

// ============ SPIKY PUFFER ============
function drawPufferCreature(ctx, s, colors, time, phase) {
  const pulse = 1 + Math.sin(time * 0.003 + phase) * 0.06;
  const r = s * 0.35 * pulse;

  // Spikes radiating out
  ctx.strokeStyle = colors[1] || colors[0];
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + Math.sin(time * 0.002 + phase) * 0.1;
    const spikeLen = s * 0.15 + Math.sin(time * 0.006 + i * 0.5) * s * 0.03;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a) * (r + spikeLen), Math.sin(a) * (r + spikeLen));
    ctx.stroke();
  }

  // Body
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Multiple eyes (the signature feature from the art pack)
  const eyePositions = [
    [-s*0.12, -s*0.12], [s*0.12, -s*0.12],
    [0, s*0.02],
    [-s*0.16, s*0.06], [s*0.16, s*0.06],
  ];
  eyePositions.forEach(([ex, ey]) => {
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(ex, ey, s * 0.06, 0, Math.PI * 2); ctx.fill();
    const look = Math.sin(time * 0.003 + phase + ex) * 1.5;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(ex + look, ey, s * 0.03, 0, Math.PI * 2); ctx.fill();
  });

  // Angry eyebrows on top two eyes
  ctx.strokeStyle = colors[2] || '#111';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-s*0.18, -s*0.2);
  ctx.lineTo(-s*0.06, -s*0.16);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s*0.18, -s*0.2);
  ctx.lineTo(s*0.06, -s*0.16);
  ctx.stroke();
}

// ============ DEEP BEAST (IMG_1117 left - spiky monster) ============
function drawDeepBeast(ctx, s, colors, time, phase) {
  const breathe = 1 + Math.sin(time * 0.003 + phase) * 0.04;
  const step = Math.sin(time * 0.006 + phase) * 2;

  // Legs / claws
  ctx.fillStyle = colors[1] || colors[0];
  for (let side = -1; side <= 1; side += 2) {
    // Front leg
    ctx.beginPath();
    ctx.moveTo(side * s * 0.2, s * 0.2);
    ctx.lineTo(side * s * 0.35, s * 0.4 + step * side);
    ctx.lineTo(side * s * 0.3, s * 0.42 + step * side);
    ctx.lineTo(side * s * 0.38, s * 0.45 + step * side);
    ctx.lineWidth = 3;
    ctx.strokeStyle = colors[1] || colors[0];
    ctx.stroke();
    // Back leg
    ctx.beginPath();
    ctx.moveTo(side * s * 0.1, s * 0.25);
    ctx.lineTo(side * s * 0.22, s * 0.45 - step * side);
    ctx.lineTo(side * s * 0.18, s * 0.47 - step * side);
    ctx.lineTo(side * s * 0.26, s * 0.5 - step * side);
    ctx.stroke();
  }

  // Body (big rounded shape)
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.35 * breathe, s * 0.3 * breathe, 0, 0, Math.PI * 2);
  ctx.fill();

  // Belly spots (from the art)
  ctx.fillStyle = colors[1] || 'rgba(255,255,255,0.15)';
  for (let i = 0; i < 5; i++) {
    const sx = -s * 0.12 + i * s * 0.06;
    const sy = s * 0.05 + Math.sin(i * 1.3) * s * 0.06;
    ctx.beginPath();
    ctx.arc(sx, sy, s * 0.03, 0, Math.PI * 2);
    ctx.fill();
  }

  // Dorsal spikes (zigzag crown)
  ctx.fillStyle = colors[2] || colors[0];
  for (let i = 0; i < 7; i++) {
    const spx = -s * 0.25 + i * s * 0.08;
    const spikeH = s * 0.12 + Math.sin(i * 0.9 + time * 0.004) * s * 0.03;
    ctx.beginPath();
    ctx.moveTo(spx - s * 0.03, -s * 0.25 * breathe);
    ctx.lineTo(spx, -s * 0.25 * breathe - spikeH);
    ctx.lineTo(spx + s * 0.03, -s * 0.25 * breathe);
    ctx.closePath();
    ctx.fill();
  }

  // Head bump / snout
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.ellipse(s * 0.3, -s * 0.02, s * 0.12, s * 0.15, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Angry eyes
  ctx.fillStyle = colors[2] || '#FFEB3B';
  ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.1, s * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(s * 0.24, -s * 0.1, s * 0.035, 0, Math.PI * 2); ctx.fill();

  // Angry brow
  ctx.strokeStyle = colors[0];
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(s * 0.15, -s * 0.18);
  ctx.lineTo(s * 0.28, -s * 0.15);
  ctx.stroke();

  // Teeth
  ctx.fillStyle = '#FFFFFF';
  for (let i = 0; i < 3; i++) {
    const tx = s * 0.32 + i * s * 0.03;
    ctx.beginPath();
    ctx.moveTo(tx, s * 0.04);
    ctx.lineTo(tx + s * 0.015, s * 0.1);
    ctx.lineTo(tx - s * 0.015, s * 0.1);
    ctx.closePath();
    ctx.fill();
  }

  // Deep glow
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.6, s * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(206,147,216,0.08)';
  ctx.fill();
}

// ============ LORIAN / SEA DRAGON (IMG_1117 right, IMG_1118) ============
function drawSeaDragon(ctx, s, colors, time, phase) {
  const sway = Math.sin(time * 0.003 + phase) * 3;
  const breathe = 1 + Math.sin(time * 0.004 + phase) * 0.03;

  // Flowing tail / body segments
  ctx.fillStyle = colors[0];
  for (let i = 0; i < 5; i++) {
    const segX = -s * 0.15 - i * s * 0.14;
    const segY = Math.sin(time * 0.004 + phase + i * 0.6) * 4;
    const segR = s * (0.14 - i * 0.015);
    ctx.beginPath();
    ctx.ellipse(segX, segY, segR, segR * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tail fin (flowing)
  const tailX = -s * 0.15 - 5 * s * 0.14;
  const tailY = Math.sin(time * 0.004 + phase + 3) * 5;
  ctx.fillStyle = colors[1] || colors[0];
  ctx.beginPath();
  ctx.moveTo(tailX, tailY);
  ctx.lineTo(tailX - s * 0.15, tailY - s * 0.12 + sway);
  ctx.lineTo(tailX - s * 0.12, tailY + sway * 0.5);
  ctx.lineTo(tailX - s * 0.18, tailY + s * 0.1 + sway);
  ctx.closePath();
  ctx.fill();

  // Head (larger oval)
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.ellipse(s * 0.12, 0, s * 0.2 * breathe, s * 0.16 * breathe, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.beginPath();
  ctx.ellipse(s * 0.32, s * 0.02, s * 0.1, s * 0.07, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Crown spines (the signature feature)
  ctx.fillStyle = colors[2] || colors[1] || colors[0];
  for (let i = 0; i < 5; i++) {
    const cx = s * 0.02 + i * s * 0.05;
    const spikeH = s * 0.18 + Math.sin(i * 1.2) * s * 0.05;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.02, -s * 0.14 * breathe);
    ctx.lineTo(cx + s * 0.005, -s * 0.14 * breathe - spikeH);
    ctx.lineTo(cx + s * 0.02, -s * 0.14 * breathe);
    ctx.closePath();
    ctx.fill();
  }

  // Seaweed-like tendrils flowing from body (from the art)
  ctx.strokeStyle = colors[1] || colors[0];
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 4; i++) {
    const bx = -s * 0.1 + i * s * 0.12;
    const wave = Math.sin(time * 0.005 + phase + i * 1.2) * 8;
    ctx.beginPath();
    ctx.moveTo(bx, s * 0.1);
    ctx.quadraticCurveTo(bx + wave, s * 0.25, bx + wave * 0.7, s * 0.4);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Eye
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(s * 0.2, -s * 0.04, s * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = colors[2] || '#FFD600';
  ctx.beginPath(); ctx.arc(s * 0.2, -s * 0.04, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(s * 0.21, -s * 0.04, s * 0.02, 0, Math.PI * 2); ctx.fill();

  // Teeth / jaw
  ctx.fillStyle = '#FFF';
  for (let i = 0; i < 3; i++) {
    const tx = s * 0.3 + i * s * 0.025;
    ctx.beginPath();
    ctx.moveTo(tx, s * 0.06);
    ctx.lineTo(tx + s * 0.01, s * 0.1);
    ctx.lineTo(tx - s * 0.01, s * 0.1);
    ctx.closePath();
    ctx.fill();
  }

  // Deep glow
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.7, s * 0.45, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(100,200,100,0.06)';
  ctx.fill();
}

// ============ ABYSSAL EYE (IMG_1122 - massive spiky eye creature) ============
function drawAbyssalEye(ctx, s, colors, time, phase) {
  const pulse = 1 + Math.sin(time * 0.002 + phase) * 0.08;
  const r = s * 0.4 * pulse;

  // Deep glow aura
  const glowPulse = 0.1 + Math.sin(time * 0.003 + phase) * 0.05;
  ctx.fillStyle = colors[2] || '#FFEB3B';
  ctx.globalAlpha = glowPulse;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Dense spikes radiating out (more than puffer, varying lengths)
  ctx.strokeStyle = colors[1] || colors[0];
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2 + Math.sin(time * 0.001 + phase) * 0.15;
    const spikeLen = s * 0.12 + Math.sin(time * 0.005 + i * 0.8 + phase) * s * 0.06;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a) * (r + spikeLen), Math.sin(a) * (r + spikeLen));
    ctx.stroke();
    // Spike tip dots
    ctx.fillStyle = colors[2] || '#FFEB3B';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * (r + spikeLen), Math.sin(a) * (r + spikeLen), 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Crown / horn on top
  ctx.fillStyle = colors[1] || colors[0];
  ctx.beginPath();
  ctx.moveTo(-s * 0.06, -r);
  ctx.lineTo(0, -r - s * 0.2);
  ctx.lineTo(s * 0.06, -r);
  ctx.closePath();
  ctx.fill();
  // Side horns
  ctx.beginPath();
  ctx.moveTo(-s * 0.12, -r + s * 0.04);
  ctx.lineTo(-s * 0.18, -r - s * 0.1);
  ctx.lineTo(-s * 0.06, -r + s * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.12, -r + s * 0.04);
  ctx.lineTo(s * 0.18, -r - s * 0.1);
  ctx.lineTo(s * 0.06, -r + s * 0.02);
  ctx.closePath();
  ctx.fill();

  // Body
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Giant central eye (the signature from IMG_1122)
  const bigR = s * 0.2;
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.ellipse(0, 0, bigR, bigR * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  // Iris
  ctx.fillStyle = colors[2] || '#FFEB3B';
  const irisLook = Math.sin(time * 0.002 + phase) * s * 0.03;
  ctx.beginPath();
  ctx.arc(irisLook, 0, bigR * 0.55, 0, Math.PI * 2);
  ctx.fill();
  // Pupil (slit)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(irisLook, 0, bigR * 0.15, bigR * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Surrounding smaller eyes (scattered around body)
  const smallEyes = [
    [-s*0.2, -s*0.15, s*0.045],
    [s*0.2, -s*0.13, s*0.04],
    [-s*0.25, s*0.05, s*0.035],
    [s*0.24, s*0.08, s*0.04],
    [-s*0.12, s*0.2, s*0.035],
    [s*0.1, s*0.22, s*0.03],
    [-s*0.05, -s*0.25, s*0.03],
    [s*0.08, -s*0.24, s*0.03],
  ];
  smallEyes.forEach(([ex, ey, er]) => {
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = colors[2] || '#FFEB3B';
    const look = Math.sin(time * 0.003 + phase + ex + ey) * er * 0.3;
    ctx.beginPath(); ctx.arc(ex + look, ey, er * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(ex + look, ey, er * 0.25, 0, Math.PI * 2); ctx.fill();
  });
}

function drawDecoration(d, time) {
  const x = d.x;
  const y = d.y;

  if (d.shape === 'coral') {
    ctx.fillStyle = d.color;
    // Draw coral branches
    for (let i = 0; i < 3; i++) {
      const bx = x - 10 + i * 10;
      const sway = Math.sin(time * 0.002 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(bx, y);
      ctx.quadraticCurveTo(bx + sway, y - 25, bx + 5 + sway, y - 35);
      ctx.quadraticCurveTo(bx + 12, y - 20, bx + 8, y);
      ctx.fill();
    }
  } else if (d.shape === 'seaweed') {
    ctx.fillStyle = d.color;
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    const sway = Math.sin(time * 0.002) * 8;
    ctx.quadraticCurveTo(x + sway, y - 25, x + sway * 0.5, y - 50);
    ctx.stroke();
    // Leaves
    ctx.beginPath();
    ctx.ellipse(x + sway * 0.7, y - 20, 6, 3, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + sway * 0.3, y - 35, 6, 3, -0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (d.shape === 'shell') {
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(x, y, 10, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(Math.PI + i * 0.7) * 10, y + Math.sin(Math.PI + i * 0.7) * 10);
      ctx.stroke();
    }
  } else if (d.shape === 'star') {
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
      const a2 = a + Math.PI / 5;
      ctx.lineTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12);
      ctx.lineTo(x + Math.cos(a2) * 5, y + Math.sin(a2) * 5);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Tap hint glow
  ctx.beginPath();
  ctx.arc(x, y - 15, 15, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fill();
}

// ============ VISITORS ============
const VISITOR_COLORS = ['#E57373','#64B5F6','#81C784','#FFB74D','#BA68C8','#4DD0E1','#FF8A65','#AED581','#F06292','#90A4AE'];
const VISITOR_HATS = ['none','beanie','cap','bow','sunhat'];
let visitors = [];          // inside the aquarium
let beachVisitors = [];     // on the beach (queue + walking to door)
let visitorSpawnTimer = null;
let floatingTexts = [];     // "+$X" popups (aquarium)
let beachFloatingTexts = []; // "+$X" popups (beach)
let totalVisitorCount = 0;  // lifetime counter shown on ticket booth

function calcAdmissionPrice() {
  let total = 15; // base price
  // Bonus from fish in tanks
  STATE.tankedFish.forEach(f => {
    total += Math.floor((f.value || 10) * 0.3);
  });
  return total;
}

function calcTotalFishCount() {
  return STATE.tankedFish.length + STATE.inventory.fish.length;
}

function getVisitorSpawnRate() {
  const fishCount = calcTotalFishCount();
  return Math.max(4000, 12000 - fishCount * 400);
}

function spawnBeachVisitor() {
  const boothX = W * 0.72;
  const groundY = H * 0.55 + 5;
  const queueSlot = beachVisitors.filter(v => !v.hasPaid && !v.gone).length;

  beachVisitors.push({
    color: VISITOR_COLORS[Math.floor(Math.random() * VISITOR_COLORS.length)],
    hat: VISITOR_HATS[Math.floor(Math.random() * VISITOR_HATS.length)],
    phase: Math.random() * Math.PI * 2,
    skinIdx: Math.floor(Math.random() * 5),
    x: W + 30,
    y: groundY,
    speed: 1.2 + Math.random() * 0.5,
    queueX: boothX + 40 + queueSlot * 28,
    state: 'walking_to_booth',
    waitTimer: 0,
    hasPaid: false,
    gone: false,
    price: calcAdmissionPrice(),
  });
}

function updateBeachVisitors() {
  const boothX = W * 0.72;
  const doorX = W * 0.35 + 95;

  beachVisitors.forEach(v => {
    if (v.gone) return;
    if (v.state === 'walking_to_booth') {
      if (v.x > v.queueX + 3) {
        v.x -= v.speed;
      } else {
        v.x = v.queueX;
        v.state = 'paying';
        v.waitTimer = 50 + Math.floor(Math.random() * 30);
      }
    } else if (v.state === 'paying') {
      v.waitTimer--;
      if (v.waitTimer <= 0) {
        v.hasPaid = true;
        STATE.money += v.price;
        updateMoney();
        totalVisitorCount++;
        beachFloatingTexts.push({ text: `+$${v.price}`, x: boothX, y: H * 0.55 - 85, life: 90 });
        v.state = 'walking_to_door';
      }
    } else if (v.state === 'walking_to_door') {
      if (v.x > doorX + 3) {
        v.x -= v.speed;
      } else {
        v.gone = true;
        const floorY = H * AQUARIUM_FLOOR_Y;
        visitors.push({
          x: 90, y: floorY, targetX: AQUARIUM_HALLWAY_W - 100,
          speed: 1.2 + Math.random() * 0.6,
          color: v.color, hat: v.hat, phase: v.phase, skinIdx: v.skinIdx,
          returning: false, lookTimer: 0, lookAt: -1, gone: false,
        });
      }
    }
  });

  // Recompute queue positions
  let slot = 0;
  beachVisitors.forEach(v => {
    if (!v.hasPaid && !v.gone) { v.queueX = boothX + 40 + slot * 28; slot++; }
  });

  beachVisitors = beachVisitors.filter(v => !v.gone);
  beachFloatingTexts.forEach(ft => ft.life--);
  beachFloatingTexts = beachFloatingTexts.filter(ft => ft.life > 0);
}

function drawBeachVisitor(v, time) {
  // Draw using the same visitor renderer, scaled down for beach
  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.scale(0.65, 0.65);
  ctx.translate(-v.x, -v.y);
  const savedLook = v.lookTimer;
  if (v.state === 'paying') v.lookTimer = 1;
  drawVisitor(v, time);
  v.lookTimer = savedLook;
  ctx.restore();
}

function drawBeachFloatingTexts() {
  beachFloatingTexts.forEach(ft => {
    const alpha = Math.min(1, ft.life / 30);
    const yOff = (90 - ft.life) * 0.5;
    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y - yOff);
  });
}

function updateVisitors(time) {
  visitors.forEach(v => {
    if (v.gone) return;

    // Pause (looking at tank, ordering, or eating)
    if (v.lookTimer > 0) {
      v.lookTimer--;
      if (v.cafeState === 'eating') {
        v.eatBob = Math.sin((time || 0) * 0.006 + v.phase) * 2;
      }
      return;
    }

    // Finished eating, head back
    if (v.cafeState === 'eating') {
      v.cafeState = 'done';
      v.returning = true;
      v.targetX = 60;
      cafeSeats = cafeSeats.filter(s => s.visitor !== v);
      return;
    }

    // Move toward target
    const dx = v.targetX - v.x;
    if (Math.abs(dx) > 3) {
      v.x += Math.sign(dx) * v.speed;
    } else {
      if (!v.returning) {
        if (!v.cafeState) {
          // Reached café counter area. Order food!
          v.cafeState = 'ordering';
          const item = CAFE_MENU[Math.floor(Math.random() * CAFE_MENU.length)];
          v.cafeItem = item;
          STATE.money += item.price;
          updateMoney();
          floatingTexts.push({ text: `+$${item.price} ${item.emoji}`, x: v.x, y: v.y - 60, life: 90 });

          // Find an open table seat
          let seated = false;
          for (let ti = 0; ti < CAFE_TABLES.length && !seated; ti++) {
            for (let si = 0; si < CAFE_TABLES[ti].seatCount && !seated; si++) {
              if (!cafeSeats.some(s => s.tableIdx === ti && s.seatIdx === si)) {
                cafeSeats.push({ tableIdx: ti, seatIdx: si, visitor: v });
                v.targetX = CAFE_TABLES[ti].x + (si === 0 ? -44 : 44);
                v.cafeState = 'walking_to_table';
                v.eatBob = 0;
                seated = true;
              }
            }
          }
          if (!seated) {
            // No seats, just leave
            v.returning = true;
            v.targetX = 60;
            v.cafeState = 'done';
          }
        } else if (v.cafeState === 'walking_to_table') {
          v.cafeState = 'eating';
          v.lookTimer = 180 + Math.floor(Math.random() * 120);
        } else {
          v.returning = true;
          v.targetX = 60;
        }
      } else {
        v.gone = true;
        cafeSeats = cafeSeats.filter(s => s.visitor !== v);
      }
    }

    // Stop at tanks (only while walking forward, before café)
    if (!v.returning && !v.cafeState) {
      let tankOffX = 200;
      AQUARIUM_TANKS.forEach((tank, i) => {
        const tw = tank.isDouble ? 800 : 400;
        const tcx = tankOffX + tw / 2;
        if (Math.abs(v.x - tcx) < 30 && v.lookAt !== i) {
          v.lookTimer = 60 + Math.floor(Math.random() * 40);
          v.lookAt = i;
        }
        tankOffX += tw + 120;
      });
    }
  });

  if (visitors.length > 8) visitors = visitors.slice(-8);
  visitors = visitors.filter(v => !v.gone);

  floatingTexts.forEach(ft => ft.life--);
  floatingTexts = floatingTexts.filter(ft => ft.life > 0);
}

// ============ CAFÉ ============
const CAFE_MENU = [
  { name: 'Croissant',  price: 5,  emoji: '🥐' },
  { name: 'Cupcake',    price: 7,  emoji: '🧁' },
  { name: 'Sea Cookie', price: 6,  emoji: '🍪' },
  { name: 'Bubble Tea', price: 8,  emoji: '🧋' },
  { name: 'Fish Cake',  price: 10, emoji: '🍥' },
];

// Café position: after the last tank
const CAFE_X = 3700;
const CAFE_W = 700;

// 3 tables with fixed positions
const CAFE_TABLES = [
  { x: CAFE_X + 150, seatCount: 2 },
  { x: CAFE_X + 350, seatCount: 2 },
  { x: CAFE_X + 550, seatCount: 2 },
];

// Track which table seats are occupied by visitors
let cafeSeats = []; // { tableIdx, seatIdx, visitor ref }

function drawCafe(time, floorY) {
  const cx = CAFE_X;
  const cw = CAFE_W;

  // Warm wall background behind café
  const cafeWall = ctx.createLinearGradient(cx, 44, cx, floorY);
  cafeWall.addColorStop(0, '#1A1210');
  cafeWall.addColorStop(0.5, '#2A1E18');
  cafeWall.addColorStop(1, '#1E1510');
  ctx.fillStyle = cafeWall;
  ctx.fillRect(cx, 44, cw, floorY - 44);

  // Warm glow
  const cafeGlow = ctx.createRadialGradient(cx + cw / 2, floorY * 0.45, 20, cx + cw / 2, floorY * 0.45, 300);
  cafeGlow.addColorStop(0, 'rgba(255,183,77,0.1)');
  cafeGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cafeGlow;
  ctx.fillRect(cx, 44, cw, floorY - 44);

  // === COUNTER (left side of café) ===
  const counterX = cx + 20;
  const counterW = 90;
  const counterH = floorY * 0.35;
  const counterY = floorY - counterH;

  // Counter body
  ctx.fillStyle = '#5D4037';
  ctx.beginPath();
  ctx.roundRect(counterX, counterY, counterW, counterH, 6);
  ctx.fill();
  // Counter top
  ctx.fillStyle = '#8D6E63';
  ctx.fillRect(counterX - 4, counterY, counterW + 8, 8);
  // Glass display case
  ctx.fillStyle = 'rgba(200,230,255,0.15)';
  ctx.beginPath();
  ctx.roundRect(counterX + 8, counterY + 12, counterW - 16, counterH * 0.4, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Food items in display
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🥐', counterX + 25, counterY + 32);
  ctx.fillText('🧁', counterX + 50, counterY + 32);
  ctx.fillText('🍪', counterX + 72, counterY + 32);

  // === MENU BOARD (on wall above counter) ===
  const boardX = counterX - 5;
  const boardY = 55;
  const boardW = counterW + 10;
  const boardH = counterY - boardY - 15;

  // Chalkboard
  ctx.fillStyle = '#1B5E20';
  ctx.beginPath();
  ctx.roundRect(boardX, boardY, boardW, boardH, 5);
  ctx.fill();
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('OCEAN CAFÉ', boardX + boardW / 2, boardY + 16);

  // Menu items
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  CAFE_MENU.forEach((item, i) => {
    const iy = boardY + 28 + i * 14;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(`${item.emoji} ${item.name}`, boardX + 6, iy);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#FFD700';
    ctx.fillText(`$${item.price}`, boardX + boardW - 6, iy);
    ctx.textAlign = 'left';
  });

  // === TABLES ===
  CAFE_TABLES.forEach((table, ti) => {
    const tx = table.x;
    const tableY = floorY - 35;
    const tableW = 60;
    const tableH = 8;

    // Table legs
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(tx - tableW / 2 + 5, tableY + tableH, 5, 27);
    ctx.fillRect(tx + tableW / 2 - 10, tableY + tableH, 5, 27);

    // Table top
    ctx.fillStyle = '#8D6E63';
    ctx.beginPath();
    ctx.roundRect(tx - tableW / 2, tableY, tableW, tableH, 3);
    ctx.fill();
    ctx.fillStyle = '#A1887F';
    ctx.fillRect(tx - tableW / 2 + 2, tableY + 1, tableW - 4, 3);

    // Chairs (simple stools on each side)
    for (let side = -1; side <= 1; side += 2) {
      const chairX = tx + side * (tableW / 2 + 14);
      ctx.fillStyle = '#37474F';
      ctx.fillRect(chairX - 6, floorY - 20, 12, 20);
      ctx.fillStyle = '#455A64';
      ctx.beginPath();
      ctx.roundRect(chairX - 8, floorY - 24, 16, 6, 3);
      ctx.fill();
    }
  });

  // "CAFÉ" sign hanging from ceiling
  ctx.fillStyle = '#FFB300';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('☕ CAFÉ', cx + cw / 2, 54);
}

const HAIR_COLORS_V = ['#1a1a1a','#3E2723','#5D4037','#8D6E63','#FFD54F','#FF8A65','#B71C1C','#E0E0E0'];
const HAIR_STYLES_V = ['short','medium','bob','ponytail','bun'];

function drawVisitor(v, time) {
  const s = 50; // bigger, more realistic
  const bob = v.cafeState === 'eating' ? (v.eatBob || 0) : Math.sin(time * 0.004 + v.phase) * 1.5;
  const dir = v.returning ? -1 : 1;
  const walking = !v.lookTimer && v.cafeState !== 'eating';
  const legSwing = walking ? Math.sin(time * 0.008 + v.phase) * 5 : 0;
  const armSwing = walking ? Math.sin(time * 0.008 + v.phase) * 0.25 : 0;

  // Deterministic appearance from phase
  const skinTones = ['#FDDBB4','#F0C27F','#D2A679','#A67C52','#8D5524'];
  const skinColor = skinTones[(v.skinIdx || Math.floor(v.phase * 10)) % skinTones.length];
  const hairColor = HAIR_COLORS_V[Math.floor(v.phase * 7 + 1) % HAIR_COLORS_V.length];
  const hairStyle = HAIR_STYLES_V[Math.floor(v.phase * 11 + 2) % HAIR_STYLES_V.length];
  const headR = s * 0.16;
  const headY = -s * 0.52;
  const neckY = headY + headR;
  const shoulderY = neckY + s * 0.06;
  const torsoW = s * 0.28;
  const torsoH = s * 0.32;
  const hipY = shoulderY + torsoH;

  ctx.save();
  ctx.translate(v.x, v.y);

  // === HAIR behind head (long styles only) ===
  if (hairStyle === 'ponytail' && v.hat === 'none') {
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.moveTo(-headR * 0.3, headY - headR * 0.2);
    ctx.quadraticCurveTo(-headR * 0.8, headY + headR * 0.5, -headR * 0.5, shoulderY + s * 0.08);
    ctx.lineTo(-headR * 0.2, shoulderY + s * 0.05);
    ctx.quadraticCurveTo(-headR * 0.4, headY + headR * 0.3, -headR * 0.1, headY - headR * 0.1);
    ctx.fill();
  }

  // === LEGS ===
  const legW = s * 0.08;
  const legH = s * 0.32;
  const pantsColors = ['#37474F','#1A237E','#4E342E','#263238','#546E7A'];
  ctx.fillStyle = pantsColors[Math.floor(v.phase * 13) % pantsColors.length];
  // Left leg
  ctx.save();
  ctx.translate(-s * 0.07, hipY + bob);
  ctx.rotate(legSwing * 0.6);
  ctx.beginPath();
  ctx.roundRect(-legW / 2, 0, legW, legH, 3);
  ctx.fill();
  // Shoe
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.roundRect(-legW / 2 - 1, legH - 2, legW + 4, s * 0.06, 2);
  ctx.fill();
  ctx.restore();
  // Right leg
  ctx.save();
  ctx.translate(s * 0.07, hipY + bob);
  ctx.rotate(-legSwing * 0.6);
  ctx.beginPath();
  ctx.fillStyle = pantsColors[Math.floor(v.phase * 13) % pantsColors.length];
  ctx.roundRect(-legW / 2, 0, legW, legH, 3);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.roundRect(-legW / 2 - 1, legH - 2, legW + 4, s * 0.06, 2);
  ctx.fill();
  ctx.restore();

  // === TORSO ===
  ctx.fillStyle = v.color;
  ctx.beginPath();
  ctx.roundRect(-torsoW / 2, shoulderY + bob, torsoW, torsoH, 4);
  ctx.fill();
  // Collar / neckline detail
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath();
  ctx.ellipse(0, shoulderY + bob + 3, torsoW * 0.3, 4, 0, 0, Math.PI);
  ctx.fill();

  // === ARMS ===
  const armW = s * 0.06;
  const armH = s * 0.26;
  ctx.fillStyle = skinColor;
  // Left arm
  ctx.save();
  ctx.translate(-torsoW / 2 - armW * 0.3, shoulderY + bob + s * 0.03);
  ctx.rotate(-armSwing);
  ctx.beginPath();
  ctx.roundRect(-armW / 2, 0, armW, armH, 3);
  ctx.fill();
  // Hand
  ctx.beginPath();
  ctx.arc(0, armH + 2, armW * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Right arm
  ctx.save();
  ctx.translate(torsoW / 2 + armW * 0.3, shoulderY + bob + s * 0.03);
  ctx.rotate(armSwing);
  ctx.beginPath();
  ctx.roundRect(-armW / 2, 0, armW, armH, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, armH + 2, armW * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // === NECK ===
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.roundRect(-s * 0.04, neckY + bob, s * 0.08, s * 0.08, 2);
  ctx.fill();

  // === HEAD ===
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.arc(0, headY + bob, headR, 0, Math.PI * 2);
  ctx.fill();
  // Subtle cheek shading
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  ctx.beginPath();
  ctx.arc(headR * 0.3, headY + bob + headR * 0.15, headR * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // === HAIR on top of head ===
  if (v.hat === 'none') {
    ctx.fillStyle = hairColor;
    if (hairStyle === 'short') {
      // Close-cropped, sits on top of head only
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.15 + bob, headR * 1.05, headR * 0.55, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      // Side tufts
      ctx.beginPath();
      ctx.ellipse(-headR * 0.85, headY + bob, headR * 0.25, headR * 0.4, 0.15, 0, Math.PI * 2);
      ctx.ellipse(headR * 0.85, headY + bob, headR * 0.25, headR * 0.4, -0.15, 0, Math.PI * 2);
      ctx.fill();
    } else if (hairStyle === 'medium') {
      // Medium length, covers top and sides of head, stops at ears
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.2 + bob, headR * 1.12, headR * 0.7, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-headR * 0.8, headY + headR * 0.1 + bob, headR * 0.35, headR * 0.5, 0.2, 0, Math.PI * 2);
      ctx.ellipse(headR * 0.8, headY + headR * 0.1 + bob, headR * 0.35, headR * 0.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (hairStyle === 'bob') {
      // Bob cut, frames face, stops at jaw
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.15 + bob, headR * 1.15, headR * 0.65, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      // Side panels down to jaw
      ctx.beginPath();
      ctx.roundRect(-headR * 1.1, headY - headR * 0.1 + bob, headR * 0.35, headR * 1.3, 3);
      ctx.roundRect(headR * 0.75, headY - headR * 0.1 + bob, headR * 0.35, headR * 1.3, 3);
      ctx.fill();
    } else if (hairStyle === 'ponytail') {
      // Top hair volume (ponytail drawn behind already)
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.2 + bob, headR * 1.08, headR * 0.6, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    } else if (hairStyle === 'bun') {
      // Top hair + bun on top
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.2 + bob, headR * 1.05, headR * 0.55, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, headY - headR * 0.7 + bob, headR * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // === HAT (drawn over hair) ===
  if (v.hat === 'beanie') {
    ctx.fillStyle = '#E53935';
    ctx.beginPath();
    ctx.ellipse(0, headY - headR * 0.15 + bob, headR * 1.1, headR * 0.7, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#C62828';
    ctx.beginPath();
    ctx.ellipse(0, headY - headR * 0.05 + bob, headR * 1.12, headR * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (v.hat === 'cap') {
    ctx.fillStyle = '#1565C0';
    ctx.beginPath();
    ctx.ellipse(0, headY - headR * 0.2 + bob, headR * 1.05, headR * 0.55, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // Brim
    ctx.beginPath();
    ctx.ellipse(dir * headR * 0.6, headY - headR * 0.1 + bob, headR * 0.7, headR * 0.12, dir * -0.2, 0, Math.PI * 2);
    ctx.fill();
  } else if (v.hat === 'bow') {
    ctx.fillStyle = '#F06292';
    ctx.beginPath();
    ctx.ellipse(headR * 0.5, headY - headR * 0.6 + bob, headR * 0.35, headR * 0.2, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headR * 0.8, headY - headR * 0.5 + bob, headR * 0.25, headR * 0.15, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#E91E63';
    ctx.beginPath();
    ctx.arc(headR * 0.65, headY - headR * 0.55 + bob, 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (v.hat === 'sunhat') {
    ctx.fillStyle = '#D4A843';
    ctx.beginPath();
    ctx.ellipse(0, headY - headR * 0.1 + bob, headR * 1.6, headR * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, headY - headR * 0.25 + bob, headR * 1.0, headR * 0.55, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#A0522D';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, headY - headR * 0.1 + bob, headR * 1.0, headR * 0.1, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // === EYES ===
  const lookDir = v.lookTimer > 0 ? 0 : dir;
  const eyeY = headY + bob - headR * 0.08;
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.ellipse(-headR * 0.35, eyeY, headR * 0.18, headR * 0.14, 0, 0, Math.PI * 2);
  ctx.ellipse(headR * 0.35, eyeY, headR * 0.18, headR * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
  // Iris
  ctx.fillStyle = '#5D4037';
  ctx.beginPath();
  ctx.arc(-headR * 0.35 + lookDir * 1.5, eyeY, headR * 0.09, 0, Math.PI * 2);
  ctx.arc(headR * 0.35 + lookDir * 1.5, eyeY, headR * 0.09, 0, Math.PI * 2);
  ctx.fill();
  // Pupil
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(-headR * 0.35 + lookDir * 1.5, eyeY, headR * 0.04, 0, Math.PI * 2);
  ctx.arc(headR * 0.35 + lookDir * 1.5, eyeY, headR * 0.04, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-headR * 0.3 + lookDir, eyeY - headR * 0.04, headR * 0.03, 0, Math.PI * 2);
  ctx.arc(headR * 0.4 + lookDir, eyeY - headR * 0.04, headR * 0.03, 0, Math.PI * 2);
  ctx.fill();

  // === NOSE ===
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(headR * 0.05, headY + bob + headR * 0.15, headR * 0.08, 0.5, Math.PI - 0.5);
  ctx.stroke();

  // === MOUTH (polite, closed) ===
  ctx.strokeStyle = 'rgba(60,30,20,0.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, headY + bob + headR * 0.4, headR * 0.2, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // === FOOD when eating ===
  if (v.cafeState === 'eating' && v.cafeItem) {
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(v.cafeItem.emoji, torsoW / 2 + s * 0.12, shoulderY + bob + torsoH * 0.5);
  }

  ctx.restore();
}

function drawFloatingTexts() {
  floatingTexts.forEach(ft => {
    const alpha = Math.min(1, ft.life / 30);
    const yOff = (90 - ft.life) * 0.5; // float upward
    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y - yOff);
  });
}

// ============ AQUARIUM INTERIOR ============
function enterAquarium() {
  STATE.scene = 'aquarium';
  document.getElementById('enter-aquarium-prompt').style.display = 'none';
  document.getElementById('dive-prompt').style.display = 'none';
  document.getElementById('exit-aquarium-btn').style.display = 'block';
  initTankFish();
  // Place player at entrance (left side of hallway)
  const floorY = H * AQUARIUM_FLOOR_Y;
  player.x = 120;
  player.y = floorY;
  player.targetX = player.x;
  player.targetY = floorY;
  aquariumCameraX = 0;
  // Reset aquarium visitors (beach visitors that already entered will appear)
  floatingTexts = [];
}

function exitAquarium() {
  STATE.scene = 'beach';
  document.getElementById('exit-aquarium-btn').style.display = 'none';
  player.x = W * 0.52;
  player.y = H * 0.65;
  player.targetX = player.x;
  player.targetY = player.y;
}

function drawAquariumInterior(time) {
  const floorY = H * AQUARIUM_FLOOR_Y;

  // Camera follows player horizontally
  aquariumCameraX = player.x - W * 0.4;
  aquariumCameraX = Math.max(0, Math.min(aquariumCameraX, AQUARIUM_HALLWAY_W - W));

  ctx.save();
  ctx.translate(-aquariumCameraX, 0);

  // === CEILING ===
  ctx.fillStyle = '#1A1A2E';
  ctx.fillRect(aquariumCameraX, 0, W, 40);
  // Ceiling trim
  ctx.fillStyle = '#0D47A1';
  ctx.fillRect(aquariumCameraX, 38, W, 6);

  // === BACK WALL ===
  const wallGrad = ctx.createLinearGradient(0, 44, 0, floorY);
  wallGrad.addColorStop(0, '#0A0A1E');
  wallGrad.addColorStop(0.5, '#0F1428');
  wallGrad.addColorStop(1, '#141830');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(aquariumCameraX, 44, W, floorY - 44);

  // Ambient glow spots from tanks (drawn behind tanks)
  let glowOffX = 200;
  AQUARIUM_TANKS.forEach((tank, i) => {
    const tw = tank.isDouble ? 800 : 400;
    const tcx = glowOffX + tw / 2;
    const glowColor = tank.zoneId === 'monster' ? 'rgba(224,64,251,0.08)' : 'rgba(79,195,247,0.08)';
    const glow = ctx.createRadialGradient(tcx, floorY * 0.45, 20, tcx, floorY * 0.45, 250);
    glow.addColorStop(0, glowColor);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(tcx - 250, floorY * 0.1, 500, floorY * 0.8);
    glowOffX += tw + 120;
  });

  // === FLOOR ===
  const floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
  floorGrad.addColorStop(0, '#2C2C3E');
  floorGrad.addColorStop(0.3, '#232336');
  floorGrad.addColorStop(1, '#1A1A2E');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(aquariumCameraX, floorY, W, H - floorY);

  // Floor tiles
  ctx.strokeStyle = 'rgba(79,195,247,0.06)';
  ctx.lineWidth = 1;
  const tileSize = 60;
  const startTile = Math.floor(aquariumCameraX / tileSize) * tileSize;
  for (let x = startTile; x < aquariumCameraX + W + tileSize; x += tileSize) {
    ctx.beginPath(); ctx.moveTo(x, floorY); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = floorY; y < H; y += tileSize) {
    ctx.beginPath(); ctx.moveTo(aquariumCameraX, y); ctx.lineTo(aquariumCameraX + W, y); ctx.stroke();
  }
  // Floor reflection line
  ctx.strokeStyle = 'rgba(79,195,247,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(aquariumCameraX, floorY); ctx.lineTo(aquariumCameraX + W, floorY); ctx.stroke();

  // === EXIT DOOR (left end) ===
  const doorX = 30;
  const doorW = 70;
  const doorH = floorY * 0.5;
  const doorY = floorY - doorH;
  // Door frame
  ctx.fillStyle = '#37474F';
  ctx.fillRect(doorX - 6, doorY - 6, doorW + 12, doorH + 6);
  // Door
  ctx.fillStyle = '#546E7A';
  ctx.fillRect(doorX, doorY, doorW, doorH);
  // EXIT sign above door
  ctx.fillStyle = '#C62828';
  ctx.beginPath();
  ctx.roundRect(doorX - 2, doorY - 30, doorW + 4, 22, 4);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', doorX + doorW / 2, doorY - 13);
  // Door handle
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(doorX + doorW - 12, doorY + doorH * 0.5, 5, 0, Math.PI * 2);
  ctx.fill();
  // Glow when player is near
  const distToExit = Math.abs(player.x - (doorX + doorW / 2));
  if (distToExit < 80) {
    ctx.fillStyle = 'rgba(198,40,40,0.15)';
    ctx.beginPath();
    ctx.arc(doorX + doorW / 2, doorY + doorH / 2, 60, 0, Math.PI * 2);
    ctx.fill();
    // Draw "Exit" hint text on screen
    ctx.save();
    ctx.translate(aquariumCameraX, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Tap to Exit', W / 2, H - 30);
    ctx.restore();
  }

  // === TANKS ON THE WALLS ===
  const tankW = 400;
  const tankH = floorY * 0.55;
  const tankY = 60;

  let tankOffsetX = 200;
  AQUARIUM_TANKS.forEach((tank, i) => {
    const tw = tank.isDouble ? tankW * 2 : tankW;
    drawWallTank(tank, tankOffsetX, tankY, tw, tankH, time);
    tankOffsetX += tw + 120;
  });

  // === DECORATIVE ELEMENTS ===
  // Rope barriers between tanks
  tankOffsetX = 200;
  for (let i = 0; i < AQUARIUM_TANKS.length - 1; i++) {
    const tw = AQUARIUM_TANKS[i].isDouble ? tankW * 2 : tankW;
    tankOffsetX += tw + 120;
    const ropeX = tankOffsetX - 60;
    // Left post
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(ropeX - 3, floorY - 50, 6, 50);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(ropeX, floorY - 50, 6, 0, Math.PI * 2); ctx.fill();
    // Right post
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(ropeX + 60 - 3, floorY - 50, 6, 50);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(ropeX + 60, floorY - 50, 6, 0, Math.PI * 2); ctx.fill();
    // Rope
    ctx.strokeStyle = '#8D6E63';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ropeX, floorY - 44);
    ctx.quadraticCurveTo(ropeX + 30, floorY - 30, ropeX + 60, floorY - 44);
    ctx.stroke();
  }

  // === CAFÉ ===
  drawCafe(time, floorY);

  // === VISITORS ===
  updateVisitors(time);
  visitors.forEach(v => {
    if (!v.gone) drawVisitor(v, time);
  });

  // === PLAYER ===
  const drawX = player.x;
  const drawY = player.y;
  const scale = player.size / 60;
  drawCreatorCharacter(drawX, drawY, scale, time);

  // Floating money texts (in world coords, scrolled with camera)
  drawFloatingTexts();

  ctx.restore();

  // === HUD (not scrolled) ===
  // Header bar
  const hGrad = ctx.createLinearGradient(0, 0, W, 0);
  hGrad.addColorStop(0, 'rgba(13,71,161,0.85)');
  hGrad.addColorStop(0.5, 'rgba(21,101,192,0.85)');
  hGrad.addColorStop(1, 'rgba(13,71,161,0.85)');
  ctx.fillStyle = hGrad;
  ctx.fillRect(0, 0, W, 36);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('AQUARIUM ADVENTURE', W / 2, 24);

  // Mini-map / position indicator
  const mapW = 120;
  const mapH = 8;
  const mapX = W / 2 - mapW / 2;
  const mapY = H - 16;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.roundRect(mapX, mapY, mapW, mapH, 4); ctx.fill();
  const dotX = mapX + (player.x / AQUARIUM_HALLWAY_W) * mapW;
  ctx.fillStyle = '#4FC3F7';
  ctx.beginPath(); ctx.arc(dotX, mapY + mapH / 2, 5, 0, Math.PI * 2); ctx.fill();
}

function drawWallTank(tank, tx, ty, tw, th, time) {
  const fish = tankFish[tank.zoneId] || [];
  const labelH = 34;

  // Outer frame (thick, dark metal)
  ctx.fillStyle = '#263238';
  ctx.beginPath();
  ctx.roundRect(tx - 8, ty - 8, tw + 16, th + labelH + 16, 8);
  ctx.fill();
  // Inner frame (lighter metal)
  ctx.fillStyle = '#37474F';
  ctx.beginPath();
  ctx.roundRect(tx - 4, ty - 4, tw + 8, th + 8, 5);
  ctx.fill();

  // Clip to water area
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(tx, ty, tw, th, 4);
  ctx.clip();

  // Water gradient
  const wg = ctx.createLinearGradient(tx, ty, tx, ty + th);
  wg.addColorStop(0, tank.color1);
  wg.addColorStop(1, tank.color2);
  ctx.fillStyle = wg;
  ctx.fillRect(tx, ty, tw, th);

  // Light rays from above
  for (let r = 0; r < 5; r++) {
    const rx = tx + tw * (0.1 + r * 0.2);
    const sway = Math.sin(time * 0.0006 + r * 1.2) * 15;
    ctx.beginPath();
    ctx.moveTo(rx + sway, ty);
    ctx.lineTo(rx + sway - 25, ty + th);
    ctx.lineTo(rx + sway + 25, ty + th);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fill();
  }

  // Sandy bottom
  const sandColor = tank.zoneId === 'monster' ? '#0D0008' : tank.zoneId === 'kelp' ? '#4E342E' : tank.zoneId === 'deep' ? '#1A1A2E' : '#8D6E63';
  ctx.fillStyle = sandColor;
  ctx.fillRect(tx, ty + th - 25, tw, 25);
  // Small sand mounds
  for (let m = 0; m < 4; m++) {
    const mx = tx + tw * (0.15 + m * 0.25);
    ctx.beginPath();
    ctx.arc(mx, ty + th - 25, 12 + m * 3, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  // Decorations in tank
  if (tank.zoneId === 'coral') {
    // Coral pieces
    for (let c = 0; c < 3; c++) {
      const cx = tx + 40 + c * 140;
      ctx.fillStyle = ['#F48FB1', '#FF7043', '#AB47BC'][c];
      for (let b = 0; b < 3; b++) {
        ctx.beginPath();
        ctx.arc(cx + b * 12 - 12, ty + th - 30 - b * 8, 8 + b * 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (tank.zoneId === 'kelp') {
    // Kelp strands
    for (let k = 0; k < 5; k++) {
      const kx = tx + 30 + k * 85;
      ctx.strokeStyle = '#2E7D32';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(kx, ty + th - 25);
      for (let seg = 0; seg < 6; seg++) {
        const sy = ty + th - 25 - seg * (th * 0.12);
        const sx = kx + Math.sin(time * 0.001 + k + seg * 0.5) * 10;
        ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }
  } else if (tank.zoneId === 'deep') {
    // Bioluminescent dots
    for (let d = 0; d < 12; d++) {
      const dx = tx + 20 + (d * 37) % tw;
      const dy = ty + 30 + (d * 53) % (th - 60);
      const pulse = 0.4 + Math.sin(time * 0.003 + d * 1.7) * 0.4;
      ctx.fillStyle = `rgba(206,147,216,${pulse * 0.5})`;
      ctx.beginPath(); ctx.arc(dx, dy, 3 + pulse * 2, 0, Math.PI * 2); ctx.fill();
    }
  } else if (tank.zoneId === 'monster') {
    // Spooky monster tank: eerie purple glow dots and dark jagged rocks
    for (let d = 0; d < 20; d++) {
      const dx = tx + 30 + (d * 53) % (tw - 60);
      const dy = ty + 30 + (d * 71) % (th - 60);
      const pulse = 0.3 + Math.sin(time * 0.002 + d * 1.3) * 0.3;
      ctx.fillStyle = `rgba(224,64,251,${pulse * 0.4})`;
      ctx.beginPath(); ctx.arc(dx, dy, 2 + pulse * 3, 0, Math.PI * 2); ctx.fill();
    }
    // Dark jagged rocks on bottom
    ctx.fillStyle = '#1A0020';
    for (let r = 0; r < 6; r++) {
      const rx = tx + tw * (0.05 + r * 0.17);
      ctx.beginPath();
      ctx.moveTo(rx, ty + th - 25);
      ctx.lineTo(rx + 10, ty + th - 50 - Math.sin(r) * 15);
      ctx.lineTo(rx + 25, ty + th - 35);
      ctx.lineTo(rx + 35, ty + th - 55 - Math.cos(r) * 10);
      ctx.lineTo(rx + 50, ty + th - 25);
      ctx.fill();
    }
    // Warning sign text
    if (fish.length === 0) {
      ctx.fillStyle = 'rgba(224,64,251,0.2)';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('DANGER', tx + tw / 2, ty + th * 0.35);
    }
  }

  // Bubbles
  for (let b = 0; b < 3; b++) {
    const bx = tx + tw * (0.2 + b * 0.3);
    const by = ty + th - 30 - ((time * 0.03 + b * 80) % (th - 40));
    const bSize = 3 + Math.sin(time * 0.005 + b) * 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx + Math.sin(time * 0.002 + b) * 5, by, bSize, 0, Math.PI * 2); ctx.stroke();
  }

  // Fish in tank (only caught fish appear here)
  if (fish.length === 0) {
    // Empty tank message
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Empty', tx + tw / 2, ty + th * 0.4);
    ctx.font = '13px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillText(tank.zoneId === 'monster' ? 'Defeat bosses in The Deep to capture them!' : 'Catch fish to fill this tank!', tx + tw / 2, ty + th * 0.55);
  }
  fish.forEach(f => {
    f.rx += f.dx * 0.006;
    f.ry += f.dy * 0.006 + Math.sin(time * 0.002 + f.phase) * 0.0006;
    if (f.rx < 0.05) { f.rx = 0.05; f.dx = Math.abs(f.dx); }
    if (f.rx > 0.95) { f.rx = 0.95; f.dx = -Math.abs(f.dx); }
    if (f.ry < 0.08) { f.ry = 0.08; f.dy = Math.abs(f.dy); }
    if (f.ry > 0.65) { f.ry = 0.65; f.dy = -Math.abs(f.dy); }
    if (f.isBoss) {
      // Draw mini boss in tank (drawBoss uses b.x for horizontal position)
      drawBoss({ ...f, x: tx + f.rx * tw, dx: f.dx > 0 ? 1 : -1, bossSize: f.bossSize || 'small', phase: f.phase, size: f.size }, time, ty + f.ry * th);
    } else {
      drawFish({ ...f, x: tx + f.rx * tw, y: ty + f.ry * th }, time);
    }
  });

  // Glass reflection (left edge shine)
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath();
  ctx.roundRect(tx + 5, ty + 5, tw * 0.06, th * 0.5, 3);
  ctx.fill();

  ctx.restore();

  // Label plaque below tank
  ctx.fillStyle = '#1A1A2E';
  ctx.beginPath();
  ctx.roundRect(tx + tw / 2 - 80, ty + th + 8, 160, labelH, 6);
  ctx.fill();
  ctx.strokeStyle = '#4FC3F7';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(tx + tw / 2 - 80, ty + th + 8, 160, labelH, 6);
  ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${tank.emoji} ${tank.name}`, tx + tw / 2, ty + th + 30);

  // "Tap to dive" hint when player is near
  const playerDist = Math.abs(player.x - (tx + tw / 2));
  if (playerDist < 250) {
    ctx.fillStyle = 'rgba(79,195,247,0.7)';
    ctx.font = '13px sans-serif';
    const fishCount = (tankFish[tank.zoneId] || []).length;
    const hint = fishCount === 0 ? 'Dive from the beach to find fish!' : `${fishCount} fish on display`;
    ctx.fillText(hint, tx + tw / 2, ty + th + 52);
  }
}

function drawTank(tank, tx, ty, tw, th, time) {
  const fish = tankFish[tank.zoneId] || [];
  const labelH = 26;
  const waterH = th - labelH;

  // Outer frame
  ctx.fillStyle = '#37474F';
  ctx.beginPath();
  ctx.roundRect(tx - 5, ty - 5, tw + 10, th + 10, 10);
  ctx.fill();

  // Clip to water area
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(tx, ty, tw, waterH, [6, 6, 0, 0]);
  ctx.clip();

  // Water gradient
  const wg = ctx.createLinearGradient(tx, ty, tx, ty + waterH);
  wg.addColorStop(0, tank.color1);
  wg.addColorStop(1, tank.color2);
  ctx.fillStyle = wg;
  ctx.fillRect(tx, ty, tw, waterH);

  // Light rays
  for (let r = 0; r < 3; r++) {
    const rx = tx + tw * (0.2 + r * 0.3);
    const sway = Math.sin(time * 0.0008 + r * 1.5) * 12;
    ctx.beginPath();
    ctx.moveTo(rx + sway, ty);
    ctx.lineTo(rx + sway - 18, ty + waterH);
    ctx.lineTo(rx + sway + 18, ty + waterH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fill();
  }

  // Sandy bottom
  const sandColor = tank.zoneId === 'kelp' ? '#4E342E' : '#8D6E63';
  ctx.fillStyle = sandColor;
  ctx.fillRect(tx, ty + waterH - 18, tw, 18);

  // Fish in tank
  fish.forEach(f => {
    f.rx += f.dx * 0.008;
    f.ry += f.dy * 0.008 + Math.sin(time * 0.003 + f.phase) * 0.0008;
    if (f.rx < 0.05) { f.rx = 0.05; f.dx = Math.abs(f.dx); }
    if (f.rx > 0.95) { f.rx = 0.95; f.dx = -Math.abs(f.dx); }
    if (f.ry < 0.08) { f.ry = 0.08; f.dy = Math.abs(f.dy); }
    if (f.ry > 0.72) { f.ry = 0.72; f.dy = -Math.abs(f.dy); }
    drawFish({ ...f, x: tx + f.rx * tw, y: ty + f.ry * waterH }, time);
  });

  // Glass shine
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath();
  ctx.roundRect(tx + 4, ty + 4, tw * 0.12, waterH * 0.45, 3);
  ctx.fill();

  ctx.restore();

  // Label bar
  ctx.fillStyle = '#263238';
  ctx.beginPath();
  ctx.roundRect(tx, ty + waterH, tw, labelH, [0, 0, 6, 6]);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = `bold ${Math.min(15, tw / 10)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${tank.emoji} ${tank.name}`, tx + tw / 2, ty + waterH + labelH - 7);

  // Tap hint
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '11px sans-serif';
  ctx.fillText('Tap to explore', tx + tw / 2, ty + 18);
}

function handleAquariumClick(cx, cy) {
  const floorY = H * AQUARIUM_FLOOR_Y;
  // Convert screen coords to world coords
  const worldX = cx + aquariumCameraX;
  const worldY = cy;

  // Check exit door (left side)
  const doorX = 30;
  const doorW = 70;
  const doorH = floorY * 0.5;
  const doorY = floorY - doorH;
  if (worldX >= doorX && worldX <= doorX + doorW && worldY >= doorY && worldY <= floorY) {
    if (Math.abs(player.x - (doorX + doorW / 2)) < 100) {
      exitAquarium();
      return;
    }
  }

  // Otherwise, walk to the tapped position (constrained to floor)
  player.targetX = Math.max(30, Math.min(worldX, AQUARIUM_HALLWAY_W - 30));
  player.targetY = floorY;
}

// ============ TIMING CATCH MINIGAME ============
// Red ball bounces left-right. Press spacebar/tap when it's over the net to catch.
let minigameState = null;

function startCatchMinigame() {
  if (!selectedTarget) return;
  document.getElementById('catch-menu').style.display = 'none';

  const mgCanvas = document.getElementById('minigame-canvas');
  const dpr = window.devicePixelRatio || 1;
  mgCanvas.width = 350 * dpr;
  mgCanvas.height = 350 * dpr;
  mgCanvas.style.width = '350px';
  mgCanvas.style.height = '350px';
  const mgCtx = mgCanvas.getContext('2d');
  mgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let difficulty = selectedTarget.difficulty || 3;
  const netBonus = getNetBonus();
  difficulty = Math.max(1, difficulty - netBonus.diffReduce);

  // Ball speed scales with difficulty (deeper = faster)
  const baseSpeed = 1.5 + difficulty * 0.35;
  // Net width: base 50px, grows with net upgrades
  const netWidth = 50 + netBonus.dotBonus * 4;
  // Catches needed
  const catchesNeeded = Math.min(Math.ceil(difficulty / 2), 5);
  // Time limit
  const totalTime = 6000 - difficulty * 250 + netBonus.timeBonus;

  minigameState = {
    canvas: mgCanvas,
    ctx: mgCtx,
    target: selectedTarget,
    ballX: 175,
    ballSpeed: baseSpeed,
    ballDir: 1,
    ballSize: 14,
    netX: 175,       // center of net (fixed)
    netWidth: netWidth,
    netY: 270,        // vertical position of net
    catchesLeft: catchesNeeded,
    catchesNeeded: catchesNeeded,
    totalTime: totalTime,
    startTime: null,
    active: false,
    waiting: true,
    swingAnim: 0,     // > 0 means net is swinging
    lastHit: false,    // was the last swing a hit?
    missAnim: 0,       // > 0 means miss flash
  };

  document.getElementById('catch-minigame').style.display = 'flex';
  drawMinigame(performance.now());

  setTimeout(() => {
    if (minigameState) {
      minigameState.waiting = false;
      minigameState.active = true;
      minigameState.startTime = performance.now();
    }
  }, 700);
}

function drawMinigame(now) {
  if (!minigameState) return;
  const mg = minigameState;
  const ctx2 = mg.ctx;
  const W2 = 350, H2 = 350;

  // Background
  const bgGrad = ctx2.createRadialGradient(175, 175, 0, 175, 175, 200);
  if (mg.isBossRound) {
    bgGrad.addColorStop(0, '#4A0000');
    bgGrad.addColorStop(1, '#1A0000');
  } else {
    bgGrad.addColorStop(0, '#0D47A1');
    bgGrad.addColorStop(1, '#002F6C');
  }
  ctx2.fillStyle = bgGrad;
  ctx2.fillRect(0, 0, W2, H2);

  ctx2.textAlign = 'center';

  if (mg.waiting) {
    ctx2.fillStyle = mg.isBossRound ? '#FF5252' : '#FFD700';
    ctx2.font = 'bold 30px sans-serif';
    ctx2.fillText(mg.isBossRound ? `ROUND ${mg.bossRoundNum}/3` : 'GET READY!', 175, 140);
    ctx2.fillStyle = 'white';
    ctx2.font = '17px sans-serif';
    ctx2.fillText(mg.target.name, 175, 175);
    ctx2.fillStyle = '#90CAF9';
    ctx2.font = '14px sans-serif';
    ctx2.fillText(mg.isBossRound ? 'Stab the ball with your trident!' : 'Press SPACE or tap when the ball is over the net!', 175, 205);
    requestAnimationFrame(t => drawMinigame(t));
    return;
  }

  // Update ball position (bounces left-right)
  if (mg.active) {
    mg.ballX += mg.ballSpeed * mg.ballDir;
    if (mg.ballX > W2 - 25) { mg.ballDir = -1; mg.ballX = W2 - 25; }
    if (mg.ballX < 25) { mg.ballDir = 1; mg.ballX = 25; }

    // Check time
    const elapsed = now - mg.startTime;
    const timeLeft = Math.max(0, mg.totalTime - elapsed);
    if (timeLeft <= 0) {
      mg.active = false;
      endMinigame(false);
      return;
    }

    // Timer bar
    const barW = 300;
    const filled = (timeLeft / mg.totalTime) * barW;
    const barColor = timeLeft < mg.totalTime * 0.3 ? '#EF5350' : timeLeft < mg.totalTime * 0.6 ? '#FFB300' : '#66BB6A';
    ctx2.fillStyle = 'rgba(255,255,255,0.15)';
    ctx2.beginPath(); ctx2.roundRect(25, 12, barW, 12, 6); ctx2.fill();
    ctx2.fillStyle = barColor;
    ctx2.beginPath(); ctx2.roundRect(25, 12, filled, 12, 6); ctx2.fill();
  }

  // Decay animations
  if (mg.swingAnim > 0) mg.swingAnim = Math.max(0, mg.swingAnim - 0.04);
  if (mg.missAnim > 0) mg.missAnim = Math.max(0, mg.missAnim - 0.03);

  // Status text
  ctx2.fillStyle = 'white';
  ctx2.font = 'bold 16px sans-serif';
  const caught = mg.catchesNeeded - mg.catchesLeft;
  ctx2.fillText(mg.isBossRound ? `Strike! ${caught}/${mg.catchesNeeded}` : `Catch! ${caught}/${mg.catchesNeeded}`, 175, 45);

  // Draw the "track" - a horizontal line where the ball moves
  const trackY = 160;
  ctx2.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx2.lineWidth = 2;
  ctx2.beginPath();
  ctx2.moveTo(25, trackY);
  ctx2.lineTo(W2 - 25, trackY);
  ctx2.stroke();

  // Draw catch zone highlight (where the net is)
  const netLeft = mg.netX - mg.netWidth / 2;
  const netRight = mg.netX + mg.netWidth / 2;

  // Zone indicator on the track
  ctx2.fillStyle = 'rgba(102,187,106,0.15)';
  ctx2.fillRect(netLeft, trackY - 30, mg.netWidth, 60);
  ctx2.strokeStyle = 'rgba(102,187,106,0.4)';
  ctx2.lineWidth = 1;
  ctx2.setLineDash([4, 4]);
  ctx2.strokeRect(netLeft, trackY - 30, mg.netWidth, 60);
  ctx2.setLineDash([]);

  // Draw weapon at bottom
  const netBaseY = mg.netY;
  const swingOffset = mg.swingAnim > 0 ? Math.sin(mg.swingAnim * Math.PI * 3) * 8 : 0;
  const weaponColor = mg.swingAnim > 0 ? (mg.lastHit ? '#66BB6A' : '#EF5350') : (mg.isBossRound ? '#FFD700' : '#8D6E63');

  if (mg.isBossRound) {
    // === TRIDENT for boss fights ===
    const tx = mg.netX;
    const ty = netBaseY + swingOffset;
    // Handle
    ctx2.strokeStyle = '#8D6E63';
    ctx2.lineWidth = 5;
    ctx2.beginPath();
    ctx2.moveTo(tx, ty + 35);
    ctx2.lineTo(tx, ty - 25);
    ctx2.stroke();
    // Trident head
    ctx2.strokeStyle = weaponColor;
    ctx2.fillStyle = weaponColor;
    ctx2.lineWidth = 3;
    // Center prong
    ctx2.beginPath();
    ctx2.moveTo(tx, ty - 25);
    ctx2.lineTo(tx, ty - 50);
    ctx2.stroke();
    ctx2.beginPath();
    ctx2.moveTo(tx - 4, ty - 45);
    ctx2.lineTo(tx, ty - 55);
    ctx2.lineTo(tx + 4, ty - 45);
    ctx2.closePath();
    ctx2.fill();
    // Left prong
    ctx2.beginPath();
    ctx2.moveTo(tx - 3, ty - 25);
    ctx2.quadraticCurveTo(tx - 14, ty - 35, tx - 14, ty - 48);
    ctx2.stroke();
    ctx2.beginPath();
    ctx2.moveTo(tx - 18, ty - 43);
    ctx2.lineTo(tx - 14, ty - 53);
    ctx2.lineTo(tx - 10, ty - 43);
    ctx2.closePath();
    ctx2.fill();
    // Right prong
    ctx2.beginPath();
    ctx2.moveTo(tx + 3, ty - 25);
    ctx2.quadraticCurveTo(tx + 14, ty - 35, tx + 14, ty - 48);
    ctx2.stroke();
    ctx2.beginPath();
    ctx2.moveTo(tx + 10, ty - 43);
    ctx2.lineTo(tx + 14, ty - 53);
    ctx2.lineTo(tx + 18, ty - 43);
    ctx2.closePath();
    ctx2.fill();
    // Cross guard
    ctx2.lineWidth = 3;
    ctx2.beginPath();
    ctx2.moveTo(tx - 16, ty - 24);
    ctx2.lineTo(tx + 16, ty - 24);
    ctx2.stroke();
  } else {
    // === NET for regular fish ===
    const netColor = weaponColor;
    ctx2.strokeStyle = '#8D6E63';
    ctx2.lineWidth = 4;
    ctx2.beginPath();
    ctx2.moveTo(mg.netX, netBaseY + 30);
    ctx2.lineTo(mg.netX, netBaseY - 5 + swingOffset);
    ctx2.stroke();
    ctx2.strokeStyle = netColor;
    ctx2.lineWidth = 3;
    ctx2.beginPath();
    ctx2.ellipse(mg.netX, netBaseY - 8 + swingOffset, mg.netWidth / 2, 12, 0, 0, Math.PI);
    ctx2.stroke();
    ctx2.strokeStyle = netColor;
    ctx2.lineWidth = 1;
    ctx2.globalAlpha = 0.5;
    for (let i = 0; i < 5; i++) {
      const nx = netLeft + (i + 1) * (mg.netWidth / 6);
      ctx2.beginPath();
      ctx2.moveTo(nx, netBaseY - 8 + swingOffset);
      ctx2.quadraticCurveTo(nx + (i % 2 ? 3 : -3), netBaseY + 12 + swingOffset, nx, netBaseY + 22 + swingOffset);
      ctx2.stroke();
    }
    for (let j = 0; j < 3; j++) {
      const ny = netBaseY + j * 8 + swingOffset;
      ctx2.beginPath();
      ctx2.moveTo(netLeft + 5, ny);
      ctx2.quadraticCurveTo(mg.netX, ny + 4, netRight - 5, ny);
      ctx2.stroke();
    }
    ctx2.globalAlpha = 1;
  }

  // Draw the bouncing red ball
  if (mg.active) {
    const bx = mg.ballX;
    const by = trackY;
    const bs = mg.ballSize;

    // Shadow on track
    ctx2.fillStyle = 'rgba(0,0,0,0.2)';
    ctx2.beginPath();
    ctx2.ellipse(bx, by + bs + 4, bs * 0.8, 3, 0, 0, Math.PI * 2);
    ctx2.fill();

    // Line from ball down to net zone
    ctx2.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx2.lineWidth = 1;
    ctx2.beginPath();
    ctx2.moveTo(bx, by + bs);
    ctx2.lineTo(bx, netBaseY - 20);
    ctx2.stroke();

    // Ball glow
    const glow = ctx2.createRadialGradient(bx, by, 0, bx, by, bs + 12);
    glow.addColorStop(0, 'rgba(229,57,53,0.5)');
    glow.addColorStop(1, 'rgba(229,57,53,0)');
    ctx2.fillStyle = glow;
    ctx2.beginPath();
    ctx2.arc(bx, by, bs + 12, 0, Math.PI * 2);
    ctx2.fill();

    // Ball body
    ctx2.fillStyle = '#E53935';
    ctx2.beginPath();
    ctx2.arc(bx, by, bs, 0, Math.PI * 2);
    ctx2.fill();
    ctx2.strokeStyle = '#FFCDD2';
    ctx2.lineWidth = 2;
    ctx2.stroke();

    // Ball shine
    ctx2.fillStyle = 'rgba(255,255,255,0.5)';
    ctx2.beginPath();
    ctx2.arc(bx - bs * 0.3, by - bs * 0.3, bs * 0.3, 0, Math.PI * 2);
    ctx2.fill();
  }

  // Miss flash
  if (mg.missAnim > 0) {
    ctx2.fillStyle = `rgba(239,83,80,${mg.missAnim * 0.3})`;
    ctx2.fillRect(0, 0, W2, H2);
  }

  // Hit flash
  if (mg.swingAnim > 0.7 && mg.lastHit) {
    ctx2.fillStyle = `rgba(102,187,106,${(mg.swingAnim - 0.7) * 0.5})`;
    ctx2.fillRect(0, 0, W2, H2);
  }

  // Fish name
  ctx2.font = '13px sans-serif';
  ctx2.fillStyle = '#90CAF9';
  ctx2.fillText(mg.target.name, 175, 338);

  // Hint
  ctx2.fillStyle = 'rgba(255,255,255,0.35)';
  ctx2.font = '12px sans-serif';
  ctx2.fillText(mg.isBossRound ? 'SPACE or tap to stab with trident!' : 'SPACE or tap to swing net', 175, 320);

  if (mg.active || mg.waiting) requestAnimationFrame(t => drawMinigame(t));
}

function handleMinigameClick(e) {
  swingNet();
}

function swingNet() {
  if (!minigameState || !minigameState.active) return;
  const mg = minigameState;
  if (mg.swingAnim > 0.5) return; // prevent spam, wait for swing to finish

  mg.swingAnim = 1;

  // Check if ball is within net zone
  const netLeft = mg.netX - mg.netWidth / 2;
  const netRight = mg.netX + mg.netWidth / 2;

  if (mg.ballX >= netLeft && mg.ballX <= netRight) {
    // Hit!
    mg.lastHit = true;
    mg.catchesLeft--;
    // Speed up ball after each catch
    mg.ballSpeed *= 1.15;
    if (mg.catchesLeft <= 0) {
      mg.active = false;
      setTimeout(() => endMinigame(true), 300);
    }
  } else {
    // Miss!
    mg.lastHit = false;
    mg.missAnim = 1;
  }
}

function endMinigame(success) {
  document.getElementById('catch-minigame').style.display = 'none';
  if (minigameState?.timer) clearTimeout(minigameState.timer);

  const wasBossRound = minigameState?.isBossRound;
  minigameState = null;

  if (wasBossRound) {
    if (success) {
      bossRoundWon();
    } else {
      bossRoundLost();
    }
    return;
  }

  if (success && selectedTarget) {
    if (STATE.inventory.fish.length < STATE.maxFish) {
      STATE.inventory.fish.push({ ...selectedTarget });
      selectedTarget.alive = false;
      updateInventory();
      showResult(`🎉 Caught ${selectedTarget.name}!`, 2000);
    } else {
      showResult("Inventory full! Can't carry more fish.", 2000);
    }
  } else {
    showResult("The fish swam away! 💨", 1500);
  }

  selectedTarget = null;
}
