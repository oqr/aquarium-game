<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boss Mockup</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060B1A; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; color: white; }
h1 { margin-bottom: 20px; color: #4FC3F7; font-size: 24px; }
canvas { border: 2px solid #1a3a5c; border-radius: 12px; margin-bottom: 20px; }
.label { color: #90CAF9; font-size: 16px; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>🦑 Boss Mockup</h1>

<div class="label">Small Boss (patrol enemy)</div>
<canvas id="c1" width="200" height="220"></canvas>

<div class="label">Medium Boss</div>
<canvas id="c2" width="280" height="280"></canvas>

<div class="label">Big Boss (final)</div>
<canvas id="c3" width="400" height="400"></canvas>

<script>
const DPR = window.devicePixelRatio || 1;

function fixDpr(canvas) {
  const w = canvas.width, h = canvas.height;
  canvas.width = w * DPR;
  canvas.height = h * DPR;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  return ctx;
}

// ---- draw one boss ----
// cx, cy = center of body
// scale = overall size multiplier
// color = main color
// tentacleCount, tentacleLen
// crown = true/false
function drawBoss(ctx, cx, cy, scale, color, glowColor, tentacleCount, tentacleLen, crown, t) {
  ctx.save();
  ctx.translate(cx, cy);

  // --- tentacles radiating downward in a fan ---
  const fanSpread = Math.PI * 0.85; // how wide the fan spreads (left to right, downward)
  const fanStart = Math.PI * 0.075; // offset from straight down

  for (let i = 0; i < tentacleCount; i++) {
    const frac = i / (tentacleCount - 1);
    const angle = Math.PI / 2 + fanStart + frac * (Math.PI - fanStart * 2) - Math.PI / 2 + Math.PI / 2;
    // spread from bottom-left to bottom-right
    const a = -fanSpread / 2 + frac * fanSpread + Math.PI / 2;

    const sway = Math.sin(t * 0.002 + i * 0.5) * 0.12;
    const finalAngle = a + sway;

    const len = tentacleLen * scale * (0.85 + Math.sin(frac * Math.PI) * 0.3);

    // tentacle base width
    const bw = (3 + (1 - Math.abs(frac - 0.5) * 2) * 2) * scale;

    // glow
    ctx.save();
    ctx.shadowBlur = 8;
    ctx.shadowColor = glowColor;

    ctx.beginPath();
    // control point curves outward
    const cpx = Math.cos(finalAngle) * len * 0.5 + Math.sin(finalAngle) * 15 * scale;
    const cpy = Math.sin(finalAngle) * len * 0.5 - Math.cos(finalAngle) * 15 * scale;
    const ex = Math.cos(finalAngle) * len;
    const ey = Math.sin(finalAngle) * len;

    // draw as tapered line
    ctx.moveTo(Math.cos(finalAngle) * 8 * scale, Math.sin(finalAngle) * 8 * scale);
    ctx.quadraticCurveTo(cpx, cpy, ex, ey);
    ctx.strokeStyle = color;
    ctx.lineWidth = bw;
    ctx.lineCap = 'round';
    ctx.stroke();

    // curly tip on outer tentacles
    if (i === 0 || i === tentacleCount - 1 || i === Math.floor(tentacleCount / 2)) {
      ctx.beginPath();
      const curlX = ex;
      const curlY = ey;
      ctx.arc(curlX + Math.cos(finalAngle + Math.PI / 2) * 5 * scale,
              curlY + Math.sin(finalAngle + Math.PI / 2) * 5 * scale,
              5 * scale, 0, Math.PI * 1.5);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * scale;
      ctx.stroke();
    }

    ctx.restore();
  }

  // --- body (rectangular with rounded corners) ---
  const bw2 = 28 * scale;
  const bh = 22 * scale;
  const bodyY = -bh / 2;

  // body glow
  ctx.save();
  ctx.shadowBlur = 18;
  ctx.shadowColor = glowColor;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-bw2 / 2, bodyY, bw2, bh, 6 * scale);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5 * scale;
  ctx.stroke();
  ctx.restore();

  // --- eyes ---
  const eyeY = bodyY + bh * 0.35;
  const eyeSpacing = 7 * scale;
  // whites
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-eyeSpacing, eyeY, 4 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeSpacing, eyeY, 4 * scale, 0, Math.PI * 2); ctx.fill();
  // pupils
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-eyeSpacing + scale, eyeY, 2 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeSpacing + scale, eyeY, 2 * scale, 0, Math.PI * 2); ctx.fill();

  // --- mouth (small, mean) ---
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5 * scale;
  ctx.beginPath();
  ctx.arc(0, bodyY + bh * 0.72, 5 * scale, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // --- crown / antennae ---
  if (crown) {
    // two little antennae on top
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.moveTo(s2 * 6 * scale, bodyY);
      ctx.quadraticCurveTo(s2 * 10 * scale, bodyY - 10 * scale, s2 * 7 * scale, bodyY - 18 * scale);
      ctx.stroke();
      // ball on tip
      ctx.fillStyle = glowColor;
      ctx.beginPath();
      ctx.arc(s2 * 7 * scale, bodyY - 18 * scale, 3 * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// ---- animate ----
let t = 0;
function loop() {
  t++;

  // --- canvas 1: small blue boss ---
  const c1 = document.getElementById('c1');
  const ctx1 = c1._ctx || (c1._ctx = fixDpr(c1));
  ctx1.clearRect(0, 0, 200, 220);
  // water bg
  const g1 = ctx1.createLinearGradient(0, 0, 0, 220);
  g1.addColorStop(0, '#0a1a3a'); g1.addColorStop(1, '#050c20');
  ctx1.fillStyle = g1; ctx1.fillRect(0, 0, 200, 220);
  drawBoss(ctx1, 100, 110, 1.0, '#4FC3F7', 'rgba(79,195,247,0.5)', 9, 65, true, t);

  // --- canvas 2: medium purple boss ---
  const c2 = document.getElementById('c2');
  const ctx2 = c2._ctx || (c2._ctx = fixDpr(c2));
  ctx2.clearRect(0, 0, 280, 280);
  const g2 = ctx2.createLinearGradient(0, 0, 0, 280);
  g2.addColorStop(0, '#0a0a2a'); g2.addColorStop(1, '#050510');
  ctx2.fillStyle = g2; ctx2.fillRect(0, 0, 280, 280);
  drawBoss(ctx2, 140, 140, 1.5, '#CE93D8', 'rgba(206,147,216,0.5)', 12, 70, true, t);

  // --- canvas 3: big dark boss ---
  const c3 = document.getElementById('c3');
  const ctx3 = c3._ctx || (c3._ctx = fixDpr(c3));
  ctx3.clearRect(0, 0, 400, 400);
  const g3 = ctx3.createLinearGradient(0, 0, 0, 400);
  g3.addColorStop(0, '#080808'); g3.addColorStop(1, '#030308');
  ctx3.fillStyle = g3; ctx3.fillRect(0, 0, 400, 400);
  drawBoss(ctx3, 200, 200, 2.2, '#37474F', 'rgba(100,120,140,0.4)', 16, 85, true, t);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
